<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title data-i18n="login.title">Sign in - DartDraw</title>
<style>
:root{--navy:#10233e;--blue:#1f6feb;--gold:#d9ad45;--ink:#142133;--muted:#5b6877;--line:#dbe2ea;--bg:#edf2f6;--red:#b3261e;--green:#1b6e3c}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:16px;background:var(--bg);font-family:Inter,Segoe UI,Arial,sans-serif;color:var(--ink)}
.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:32px;box-shadow:0 12px 28px #26394a1a;width:100%;max-width:360px}
.brand{display:flex;align-items:center;gap:11px;font-weight:800;letter-spacing:.3px;font-size:20px;margin-bottom:4px}
.brand-mark{width:31px;height:31px;border:3px solid var(--gold);border-radius:50%;display:grid;place-items:center;font-size:15px;background:var(--navy);color:var(--gold)}
h1{margin:0;font:inherit}
p.sub{margin:0 0 22px;color:var(--muted);font-size:13px}
.field{margin:0 0 14px}
.field label{display:block;font-size:12px;font-weight:700;margin-bottom:6px}
input{height:44px;border:1px solid #8a97a6;border-radius:7px;padding:9px 11px;font-size:16px;width:100%;font-family:inherit;color:var(--ink);background:#fff}
.btn{border:0;border-radius:8px;padding:11px 14px;min-height:44px;font-weight:750;font-size:14px;font-family:inherit;cursor:pointer;width:100%;background:var(--blue);color:#fff;margin-top:6px}
.btn:hover{background:#1a5fcc}
.btn:disabled{opacity:.6;cursor:default}
.btn.secondary{background:#fff;color:var(--blue);border:1px solid var(--blue)}
.btn.secondary:hover{background:#eef4ff}
a:focus-visible,input:focus-visible,.btn:focus-visible,.msg:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
input:focus-visible{border-color:var(--blue)}
.msg{border-radius:8px;padding:9px 11px;font-size:13px;margin-bottom:14px}
.msg:empty{display:none}
.msg.err{background:#fdeceb;color:var(--red)}
.msg.ok{background:#e8f5ec;color:var(--green)}
.foot{text-align:center;margin-top:14px;font-size:13px;color:var(--muted)}
.foot a{display:inline-block;padding:10px 6px;color:var(--blue);text-decoration:underline;font-weight:700}
/* "No account yet?": shown while sign-up is closed. The contact line is the Admin's own text (Admin > Settings), set with textContent. */
.noacct{margin-top:6px;line-height:1.5}
.noacct b{color:var(--ink)}
.noacct .contact{display:block;margin-top:4px;color:var(--ink);overflow-wrap:anywhere}
[hidden]{display:none!important}
/* The top row: the logo and the EN | BM switch (i18n/auth-i18n.js shows it; hidden without JavaScript and in the pop-up). */
.top{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:4px}
.top .brand{margin-bottom:0}
.langsw{display:inline-flex;gap:2px;padding:2px;border:1.5px solid #c3cfdf;border-radius:10px;background:#fff;flex:none}
.langsw button{min-width:40px;min-height:36px;padding:0 8px;border:0;border-radius:7px;background:transparent;color:#2b3a50;font:700 13px/1 Inter,Segoe UI,Arial,sans-serif;letter-spacing:.04em;cursor:pointer}
.langsw button:hover{background:#eef3fa;color:var(--navy)}
.langsw button[aria-pressed="true"]{background:var(--navy);color:#fff}
.langsw button:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
/* small phones: a little less card padding, so the logo, the switch and the longer BM button labels stay on one line */
@media (max-width:360px){.card{padding:26px 20px}.langsw button{min-width:36px;padding:0 6px}}
/* Embedded in the pop-up on the public site (login.html?embed=1): no page background or centring, a flat card. */
html.embed body{display:block;min-height:0;padding:0;background:transparent}
html.embed .card{max-width:none;border:0;border-radius:0;box-shadow:none;margin:0;background:transparent;padding:30px 30px 24px}
</style>
</head>
<body>
<main class="card">
  <div class="top">
  <div class="brand"><span class="brand-mark" aria-hidden="true">D</span> <h1>DartDraw</h1></div>
    <div class="langsw" role="group" aria-label="Language / Bahasa" data-lang-switch hidden><button type="button" lang="en" aria-label="English" aria-pressed="true" data-lang-set="en">EN</button><button type="button" lang="ms" aria-label="Bahasa Malaysia" aria-pressed="false" data-lang-set="ms">BM</button></div>
  </div>
  <p class="sub" data-i18n="login.sub">Sign in to manage your tournaments.</p>
  <div class="msg" id="msg" aria-live="polite" tabindex="-1"></div>
  <div id="resendBox" hidden>
    <button class="btn secondary" id="resendBtn" type="button" data-i18n="login.resend">Resend verification email</button>
  </div>
  <form id="loginForm">
    <div class="field"><label for="email" data-i18n="auth.email">Email</label><input type="email" id="email" autocomplete="username" autocapitalize="none" spellcheck="false" required></div>
    <div class="field"><label for="password" data-i18n="auth.password">Password</label><input type="password" id="password" autocomplete="current-password" required></div>
    <button class="btn" id="submitBtn" type="submit" data-i18n="auth.signIn">Sign in</button>
  </form>
  <div class="foot"><a href="/forgot.html">Forgot password?</a></div>
  <div class="foot" id="signupFoot" hidden><span data-i18n="login.needAccount">Need an account?</span> <a href="/register.html" data-i18n="login.signUp">Sign up</a></div>
  <div class="foot noacct" id="noAccountFoot"><b>No account yet?</b> Accounts are created by the site admin.<span class="contact" id="adminContact" hidden></span></div>
</main>
<script src="/i18n/auth.en.js"></script>
<script data-dd-ms>/* The Bahasa Malaysia tables (and errors.en.js, which only BM needs): written here (so they run before auth-i18n.js)
   only when BM is the language, chosen as auth-i18n.js does: ?lang=ms, else (the pop-up) the page around it, else the
   saved choice. English pages never download them; auth-i18n.js fetches them on a switch to BM. */
var DD_MS_FILES = ["/i18n/errors.en.js", "/i18n/auth.ms.js", "/i18n/errors.ms.js"];
(function(){ try{ var q = location.search, m = /[?&]lang=(en|ms)(?=&|$)/.exec(q), l = m ? m[1] : null;
  if(!l && /[?&]embed=1(&|$)/.test(q) && window.top !== window){ try{ var p = String(window.parent.document.documentElement.getAttribute('lang') || ''); l = /^ms/i.test(p) ? 'ms' : /^en/i.test(p) ? 'en' : null; }catch(e){} }
  if(!l) l = localStorage.getItem('dartdraw.lang');
  if(l === 'ms') for(var i = 0; i < DD_MS_FILES.length; i++) document.write('<script src="' + DD_MS_FILES[i] + '"><\/script>'); }catch(e){} })();
</script>
<script src="/i18n/auth-i18n.js"></script>
<script>
/* Words: the English texts below go through I18N.put (i18n/auth-i18n.js), which shows them in the reader's language (EN or
   BM), and a server answer's code in BM; without that script the English is shown as written. */
const I18N = window.DDAuth || { put(el, s, o){ el.textContent = String(s) + (o && o.after ? ' ' + o.after : ''); } };
/* Embedded mode: the public site shows this page in a pop-up. Success and the other pages then open in the whole window. */
const embedded = new URLSearchParams(location.search).get('embed') === '1' && window.top !== window;
if(embedded){
  document.documentElement.classList.add('embed');
  document.querySelectorAll('a').forEach((a) => { a.target = '_top'; });
  document.addEventListener('keydown', (e) => {
    if(e.key === 'Escape'){ window.parent.postMessage({ type:'dartdraw-close-login' }, location.origin); }
  });
}
const msgEl = document.getElementById('msg');
const resendBox = document.getElementById('resendBox');
const resendBtn = document.getElementById('resendBtn');
const btn = document.getElementById('submitBtn');

function show(text, kind, opt){
  I18N.put(msgEl, text, opt);
  msgEl.className = 'msg ' + kind;
}
function clearMsg(){
  I18N.put(msgEl, '');
  msgEl.className = 'msg';
  resendBox.hidden = true;
}
async function postJson(url, payload){
  const res = await fetch(url, {
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body: JSON.stringify(payload)
  });
  let body = {};
  try{ body = await res.json(); }catch(e){ body = {}; }
  return { res, body };
}

// Show the Sign up link only while sign-up is open; otherwise "No account yet?" stays, with the Admin's contact line
// under it when one is set. The line is plain text from Admin > Settings: it is only ever set with textContent.
// If the check fails the link stays hidden and the note shows without a contact line.
fetch('/api/auth/config', { cache:'no-store' })
  .then((r) => r.ok ? r.json() : null)
  .then((cfg) => {
    if(!cfg) return;
    if(cfg.signupOpen === true){
      document.getElementById('signupFoot').hidden = false;
      document.getElementById('noAccountFoot').hidden = true;
      return;
    }
    const line = typeof cfg.adminContact === 'string' ? cfg.adminContact.trim().slice(0, 200) : '';
    const el = document.getElementById('adminContact');
    el.textContent = line;
    el.hidden = !line;
  })
  .catch(() => {});

document.getElementById('loginForm').addEventListener('submit', async (e)=>{
  e.preventDefault();
  clearMsg();
  btn.disabled = true; I18N.put(btn, 'Signing in…');
  try{
    const { res, body } = await postJson('/api/auth/login', {
      email: document.getElementById('email').value,
      password: document.getElementById('password').value
    });
    if(res.ok){
      if(embedded){ window.top.location.replace('/app'); } else { window.location.replace('/app'); }
      return;
    }
    if(res.status === 403 && body.code === 'unverified'){
      show('Please verify your email first.', 'err', { code: body.code });
      resendBox.hidden = false;
    }else if(res.status === 403 && body.code === 'suspended'){
      show(body.error || 'This account has been suspended.', 'err', { code: body.code });
    }else if(res.status === 429){
      show(body.error || 'Too many attempts. Try again later.', 'err', { code: body.code || 'rate_limited' });
    }else{
      show(body.error || 'Could not sign in.', 'err', { code: body.code, vars: body });
    }
  }catch(err){
    show('Could not reach the server. Check your connection and try again.', 'err');
  }
  btn.disabled = false; I18N.put(btn, 'Sign in');
});

resendBtn.addEventListener('click', async ()=>{
  const email = document.getElementById('email').value;
  resendBtn.disabled = true;
  try{
    const { res, body } = await postJson('/api/auth/resend-verification', { email });
    if(res.ok){
      resendBox.hidden = true;
      show(body.message || 'If that account can be verified, we have sent a new verification link.', 'ok');
    }else{
      show(body.error || 'Could not send the email.', 'err', { code: body.code, vars: body });
    }
  }catch(err){
    show('Could not reach the server. Check your connection and try again.', 'err');
  }
  resendBtn.disabled = false;
});
</script>
</body>
</html>
