<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<title data-i18n="verify.title">Verify email - DartDraw</title>
<style>
:root{--navy:#10233e;--blue:#1f6feb;--gold:#d9ad45;--ink:#142133;--muted:#5b6877;--line:#dbe2ea;--bg:#edf2f6;--red:#b3261e;--green:#1b6e3c}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:16px;background:var(--bg);font-family:Inter,Segoe UI,Arial,sans-serif;color:var(--ink)}
.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:32px;box-shadow:0 12px 28px #26394a1a;width:100%;max-width:380px}
.brand{display:flex;align-items:center;gap:11px;font-weight:800;letter-spacing:.3px;font-size:20px;margin-bottom:4px}
.brand-mark{width:31px;height:31px;border:3px solid var(--gold);border-radius:50%;display:grid;place-items:center;font-size:15px;background:var(--navy);color:var(--gold)}
h1{margin:0;font:inherit}
p.sub{margin:0 0 22px;color:var(--muted);font-size:13px}
.field{margin:0 0 14px}
.field label{display:block;font-size:12px;font-weight:700;margin-bottom:6px}
.hint{font-size:12px;color:var(--muted);margin-top:4px}
input{height:44px;border:1px solid #8a97a6;border-radius:7px;padding:9px 11px;font-size:16px;width:100%;font-family:inherit;color:var(--ink);background:#fff}
.btn{display:block;text-align:center;text-decoration:none;border:0;border-radius:8px;padding:12px 14px;min-height:44px;font-weight:750;font-size:14px;font-family:inherit;cursor:pointer;width:100%;background:var(--blue);color:#fff;margin-top:6px}
.btn:hover{background:#1a5fcc}
.btn:disabled{opacity:.6;cursor:default}
a:focus-visible,input:focus-visible,.btn:focus-visible,.msg:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
input:focus-visible{border-color:var(--blue)}
.msg{border-radius:8px;padding:9px 11px;font-size:13px;margin-bottom:14px;background:#eef2f7;color:var(--ink)}
.msg:empty{display:none}
.msg.err{background:#fdeceb;color:var(--red)}
.msg.ok{background:#e8f5ec;color:var(--green)}
[hidden]{display:none!important}
/* The top row: the logo and the EN | BM switch (i18n/auth-i18n.js shows it; hidden without JavaScript and in the pop-up). */
.top{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:4px}
.top .brand{margin-bottom:0}
.langsw{display:inline-flex;gap:2px;padding:2px;border:1.5px solid #c3cfdf;border-radius:10px;background:#fff;flex:none}
.langsw button{min-width:40px;min-height:36px;padding:0 8px;border:0;border-radius:7px;background:transparent;color:#2b3a50;font:700 13px/1 Inter,Segoe UI,Arial,sans-serif;letter-spacing:.04em;cursor:pointer}
.langsw button:hover{background:#eef3fa;color:var(--navy)}
.langsw button[aria-pressed="true"]{background:var(--navy);color:#fff}
.langsw button:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
/* small phones: a little less card padding, so the logo, the switch and the longer BM button labels stay on one line */
@media (max-width:360px){.card{padding:26px 20px}.langsw button{min-width:36px;padding:0 6px}}
</style>
</head>
<body>
<main class="card">
  <div class="top">
  <div class="brand"><span class="brand-mark" aria-hidden="true">D</span> <h1>DartDraw</h1></div>
    <div class="langsw" role="group" aria-label="Language / Bahasa" data-lang-switch hidden><button type="button" lang="en" aria-label="English" aria-pressed="true" data-lang-set="en">EN</button><button type="button" lang="ms" aria-label="Bahasa Malaysia" aria-pressed="false" data-lang-set="ms">BM</button></div>
  </div>
  <p class="sub" data-i18n="verify.sub">Email verification</p>
  <div class="msg" id="msg" aria-live="polite" tabindex="-1"></div>
  <form id="verifyForm">
    <div class="field"><label for="password" data-i18n="auth.password">Password</label><input type="password" id="password" autocomplete="current-password" required aria-describedby="pwHint">
      <div class="hint" id="pwHint" data-i18n="verify.pwHint">Enter the password you chose when you signed up.</div>
    </div>
    <button class="btn" id="submitBtn" type="submit" data-i18n="verify.submit">Verify email</button>
  </form>
  <a class="btn" id="signinLink" href="/?login=1" hidden data-i18n="auth.signIn">Sign in</a>
</main>
<script src="/i18n/auth.en.js"></script>
<script data-dd-ms>/* The Bahasa Malaysia tables (and errors.en.js, which only BM needs): written here (so they run before auth-i18n.js)
   only when BM is the language, chosen as auth-i18n.js does: ?lang=ms, else (the pop-up) the page around it, else the
   saved choice. English pages never download them; auth-i18n.js fetches them on a switch to BM. */
var DD_MS_FILES = ["/i18n/errors.en.js", "/i18n/auth.ms.js", "/i18n/errors.ms.js"];
(function(){ try{ var q = location.search, m = /[?&]lang=(en|ms)(?=&|$)/.exec(q), l = m ? m[1] : null;
  if(!l && /[?&]embed=1(&|$)/.test(q) && window.top !== window){ try{ var p = String(window.parent.document.documentElement.getAttribute('lang') || ''); l = /^ms/i.test(p) ? 'ms' : /^en/i.test(p) ? 'en' : null; }catch(e){} }
  if(!l) l = localStorage.getItem('dartdraw.lang');
  if(l === 'ms') for(var i = 0; i < DD_MS_FILES.length; i++) document.write('<script src="' + DD_MS_FILES[i] + '"><\/script>'); }catch(e){} })();
</script>
<script src="/i18n/auth-i18n.js"></script>
<script>
/* Words: the English texts below go through I18N.put (i18n/auth-i18n.js), which shows them in the reader's language (EN or
   BM), and a server answer's code in BM; without that script the English is shown as written. */
const I18N = window.DDAuth || { put(el, s, o){ el.textContent = String(s) + (o && o.after ? ' ' + o.after : ''); } };
const msgEl = document.getElementById('msg');
const form = document.getElementById('verifyForm');
const btn = document.getElementById('submitBtn');
const link = document.getElementById('signinLink');
// The token only ever travels in the request body, and nothing is sent until
// the person submits the form (opening or pre-fetching the link verifies nothing).
const token = new URLSearchParams(location.search).get('token');

function show(text, kind, opt){
  I18N.put(msgEl, text, opt);
  msgEl.className = 'msg ' + kind;
}
function finish(text, kind, opt){
  form.hidden = true;
  show(text, kind, opt);
  link.hidden = false;
  msgEl.focus();
}

if(!token){
  finish('This link is invalid or has expired.', 'err');
}

form.addEventListener('submit', async (e)=>{
  e.preventDefault();
  I18N.put(msgEl, ''); msgEl.className = 'msg';
  const password = document.getElementById('password').value;
  btn.disabled = true; I18N.put(btn, 'Verifying…');
  try{
    const res = await fetch('/api/auth/verify', {
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ token, password })
    });
    let body = {};
    try{ body = await res.json(); }catch(err){ body = {}; }
    if(res.ok){
      finish('Your email is verified. You can now sign in.', 'ok');
      return;
    }
    show(body.error || 'Could not verify your email.', 'err', { code: body.code, vars: body });
    document.getElementById('password').focus();
  }catch(err){
    show('Could not reach the server. Check your connection and try again.', 'err');
  }
  btn.disabled = false; I18N.put(btn, 'Verify email');
});
</script>
</body>
</html>
