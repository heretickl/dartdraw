<script data-dd-ms>/* The Bahasa Malaysia tables: written here (so they run before i18n.js) only when BM is the language at start-up,
   ?lang=ms or else the saved choice. English pages never download them; i18n/i18n.js fetches them on a switch to BM. */
var DD_MS_FILES = ["/i18n/render.ms.js", "/i18n/ms.js"];
(function(){ try{ var m = /[?&]lang=(en|ms)(?=&|$)/.exec(location.search), l = m ? m[1] : localStorage.getItem('dartdraw.lang');
  if(l === 'ms') for(var i = 0; i < DD_MS_FILES.length; i++) document.write('<script src="' + DD_MS_FILES[i] + '"><\/script>'); }catch(e){} })();
</script>
<script src="/i18n/i18n.js"></script>
<script src="/home.js"></script>
<script>
/* Read-only results viewer. Fetches the sanitized public copy of one
   tournament and draws it with the same standings / bracket code the
   organiser app uses (render.js). Nothing here can change a tournament. */
let state = null;
var POLL_MS = 20000;
var lastUpdatedAt = null, lastOkAt = 0, fitBracket = {};
var evStages = [];   // per-stage status from the server (api/public), for the stage cards

function slugFromUrl(){
  var q = new URLSearchParams(location.search).get('s');
  if(q) return q;
  var parts = location.pathname.split('/').filter(Boolean);
  return parts[parts.length-1] === 'live.html' ? '' : (parts[parts.length-1] || '');
}
var SLUG = slugFromUrl();

function el(id){ return document.getElementById(id); }

/* A link to the spectator Help that knows which event it came from (/help?from=<slug>#anchor, or /ms/help... in BM), so Help can offer
   "Back to the event". Only a slug of the shape the server accepts is passed on; anything else gives the plain /help. */
var SLUG_RE = /^[a-z0-9]{8,40}$/;
function helpHref(anchor){
  var h = '/help' + (SLUG_RE.test(SLUG || '') ? '?from=' + SLUG : '') + (anchor ? '#' + anchor : '');
  return typeof hmLangHref === 'function' ? hmLangHref(h) : h;   // /ms/help when BM was chosen on the Help page (home.js)
}
function setHelpLinks(){
  var h = el('hHelp'); if(h && h.setAttribute) h.setAttribute('href', helpHref(''));
  var f = document.querySelector ? document.querySelector('footer a[href^="/help"], footer a[href^="/ms/help"]') : null;
  if(f && f.setAttribute) f.setAttribute('href', helpHref(''));
}
setHelpLinks();

/* Words: every one comes from the string tables (i18n/en.js, i18n/ms.js, and render.js's own) through T(key, vars), in the
   reader's language. The tournament's own text (names, event and tournament names) is never translated. */
function boardLabel(g){
  var b = (g.boards||[]).filter(function(x){ return x!=null; });
  return b.length ? T('ev.boards', {n:b.length, list:b.join(', ')}) : '';
}
function groupLabel(label){ return T('ev.group', {g:label}); }
function entryName(id){
  var e = state.entriesList.find(function(x){ return x.id===id; });
  return e ? e.name : '—';
}
/* What the page calls an entry: a team in a Teams event, a player in every other one (a Doubles pair is still a player
   here). The one place that decides it: sentences that name it have a .team and a .player key (TU). */
function isTeamsEvent(s){ s = s || state; return !!(s && s.eventCreation && s.eventCreation.competitionUnit==='Teams'); }
function TE(key, vars){ return TU(key, isTeamsEvent(), vars); }

/* ---------- Colour theme: Auto follows the phone; Light / Dark override and are remembered ---------- */
var THEME_KEY = 'dartdraw.viewer.theme';
function savedTheme(){ try{ var t = localStorage.getItem(THEME_KEY); return (t==='light' || t==='dark') ? t : 'auto'; }catch(e){ return 'auto'; } }
function applyTheme(t){
  var root = document.documentElement;
  if(t==='auto') root.removeAttribute('data-theme'); else root.setAttribute('data-theme', t);
  try{ if(t==='auto') localStorage.removeItem(THEME_KEY); else localStorage.setItem(THEME_KEY, t); }catch(e){}
  document.querySelectorAll('[data-theme-set]').forEach(function(b){ b.setAttribute('aria-pressed', b.getAttribute('data-theme-set')===t ? 'true' : 'false'); });
}
document.querySelectorAll('[data-theme-set]').forEach(function(b){
  b.setAttribute('aria-pressed', b.getAttribute('data-theme-set')===savedTheme() ? 'true' : 'false');
  b.addEventListener('click', function(){ applyTheme(b.getAttribute('data-theme-set')); });
});

/* ---------- Me and Following ----------
   Kept on this device only (localStorage, per tournament link): nothing is sent
   anywhere and there's no account. "Me" is one player; "Following" is any number. */
var STORE_KEY = 'dartdraw.viewer.' + SLUG;
var prefs = loadPrefs();
function loadPrefs(){
  try{
    var p = JSON.parse(localStorage.getItem(STORE_KEY) || '{}') || {};
    return { me: typeof p.me==='string' ? p.me : null,
             follow: Array.isArray(p.follow) ? p.follow.filter(function(x){ return typeof x==='string'; }) : [] };
  }catch(e){ return { me:null, follow:[] }; }
}
function savePrefs(){ try{ localStorage.setItem(STORE_KEY, JSON.stringify(prefs)); }catch(e){} }
function entryObj(id){ return (state && state.entriesList.find(function(e){ return e.id===id; })) || null; }
function myId(){ return prefs.me && entryObj(prefs.me) ? prefs.me : null; }
function followIds(){ return prefs.follow.filter(function(id){ return id!==prefs.me && entryObj(id); }); }
function isFollowing(id){ return followIds().indexOf(id) !== -1; }
function setMe(id){ prefs.me = id; prefs.follow = prefs.follow.filter(function(x){ return x!==id; }); savePrefs(); }
function clearMe(){ prefs.me = null; savePrefs(); }
function toggleFollow(id){
  if(id===prefs.me) return;
  var i = prefs.follow.indexOf(id);
  if(i===-1) prefs.follow.push(id); else prefs.follow.splice(i,1);
  savePrefs();
}

/* ---------- What a player has played / still has to play ---------- */
function ordinal(n){ return ddOrdinal(n); }
function scoreEntered(sc){
  return !!sc && sc.legs1!==undefined && sc.legs1!=='' && sc.legs2!==undefined && sc.legs2!=='' &&
    !isNaN(parseInt(sc.legs1)) && !isNaN(parseInt(sc.legs2));
}
function podOf(id){ return (state.pods||[]).find(function(p){ return p.entryIds.indexOf(id)!==-1; }) || null; }
/* Where a Group Boards player is drawn: "Group 3 · Board 3". Empty for other formats. */
function podPlace(id, withBoard){
  var p = podOf(id);
  return p ? [groupLabel(p.label), withBoard ? boardLabel(p) : ''].filter(Boolean).join(' · ') : '';
}
function groupOf(id){ return (state.groups||[]).find(function(g){ return g.entryIds.indexOf(id)!==-1; }) || null; }
function positionIn(g, id){
  if(!g.gameStarted) return null;
  var r = computeStandings(g).find(function(s){ return s.id===id; });
  return r ? r.position : null;
}
function groupRows(id){
  var g = groupOf(id);
  if(!g) return null;
  var rows = [];
  g.entryIds.forEach(function(o){
    if(o===id || !entryObj(o)) return;
    var sc = getScore(g, id, o), first = id < o;
    if(scoreEntered(sc)){
      rows.push({opp:o, played:true, my:parseInt(first ? sc.legs1 : sc.legs2), op:parseInt(first ? sc.legs2 : sc.legs1), wo:!!sc.wo});
    } else rows.push({opp:o, played:false});
  });
  return {g:g, rows:rows};
}
function koLines(id){
  var out = [], multi = state.format.formatType==='rrknockout', brackets = [];
  (state.pods||[]).forEach(function(p){ if(p.bracket && p.entryIds.indexOf(id)!==-1) brackets.push([p.bracket, groupLabel(p.label), p]); });
  brackets.push([state.knockout, T(state.format.formatType==='podknockout' ? 'ev.pod.finals' : (multi ? 'ev.br.main' : 'ev.br.bracket'))]);
  brackets.push([state.knockoutLosers, T('ev.br.plate')]);
  brackets.forEach(function(pair){
    var b = pair[0];
    if(!b || !b.rounds) return;
    b.rounds.forEach(function(round, ri){
      round.forEach(function(m, mi){
        if(m.aEntryId===id || m.bEntryId===id) out.push({b:b, title:pair[1], pod:pair[2]||null, ri:ri, mi:mi, m:m, round:koRoundName(b, ri), tag:koMatchTag(b, state, ri, mi)});
      });
    });
  });
  return out;
}
function koOpponent(l, id){ return l.m.aEntryId===id ? l.m.bEntryId : l.m.aEntryId; }
/* A result as { txt, cls: 'w' won | 'l' lost | 't' anything else, wo: by walkover }. */
function resultOf(kind, my, op, wo){
  var score = my!=null && op!=null ? my+'–'+op : null;
  if(kind==='drew') return {txt:T('ev.res.drew', {score:score}), cls:'t', wo:false};
  var k = kind==='won' ? 'won' : 'lost';
  return {txt:score!=null ? T('ev.res.'+k+(wo ? 'Wo' : ''), {score:score}) : T('ev.res.'+k+'Bare'+(wo ? 'Wo' : '')), cls:k==='won' ? 'w' : 'l', wo:!!wo};
}
function koResultText(l, id){
  var m = l.m, mine = m.aEntryId===id, my = mine ? m.aLegs : m.bLegs, op = mine ? m.bLegs : m.aLegs;
  if(m.bye) return {txt:T('ev.res.bye'), cls:'t'};
  if(m.void) return {txt:T('ev.res.void'), cls:'t'};
  if(!m.winnerId) return {txt:T(koOpponent(l, id) ? 'ev.res.toPlay' : 'ev.res.waiting'), cls:'t'};
  return resultOf(m.winnerId===id ? 'won' : 'lost', my, op, m.wo);
}
/* A result on a player's page, written in full: "Won 2–0 by walkover" (the opponent did not turn up) or "Lost 0–2 by
   walkover" (this player did not). The compact "WO" stays only in the grid and the bracket chart, where there is no room,
   and their keys say what it means. */
function resultHTML(r){
  return '<span class="res '+r.cls+(r.wo ? ' wo' : '')+'">'+escapeHtml(r.txt)+'</span>';
}

/* One line saying where a player is right now. */
function statusLine(id){
  var e = entryObj(id);
  if(!e) return '';
  if(e.withdrawn) return T('ev.withdrawn');
  var ko = koLines(id);
  if(ko.length){
    var l = ko[ko.length-1], m = l.m, opp = koOpponent(l, id), inFinal = l.ri===l.b.rounds.length-1;
    var where = l.b.podLabel ? 'In' : l.b.podFinals ? 'Finals' : '', v = {round:l.round, title:l.title, tag:l.tag, name:opp ? entryName(opp) : ''};
    if(m.void) return TE('ev.st.outVoid'+where, v);
    if(m.winnerId){
      if(m.winnerId===id){
        if(l.b.podLabel && inFinal) return T('ev.st.wonPod', v);
        return inFinal ? T('ev.st.winnerOf', v) : T(m.bye ? 'ev.st.bye' : 'ev.st.won', v);
      }
      return T('ev.st.lost'+where, v);
    }
    var next = T('ev.st.next'+(l.b.podLabel || l.b.podFinals ? 'In' : '')+(opp ? '' : 'Tbd'), v);
    return [next, l.pod && l.pod.boards && l.pod.boards.length ? T('ev.board', {b:l.pod.boards.join(', ')}) : ''].filter(Boolean).join(' · ');
  }
  var gr = groupRows(id);
  if(!gr) return '';
  var g = gr.g, lab = groupLabel(g.label);
  if(!g.gameStarted) return T('ev.st.notStarted', {group:lab});
  var todo = gr.rows.filter(function(r){ return !r.played; });
  if(todo.length){
    var names = todo.slice(0,3).map(function(r){ return entryName(r.opp); }).join(', ');
    return [T(todo.length>3 ? 'ev.st.toPlayMore' : 'ev.st.toPlay', {group:lab, names:names, n:todo.length-3}), boardLabel(g)].filter(Boolean).join(' · ');
  }
  var pos = positionIn(g, id), done = groupIsComplete(g);
  var s = T(pos ? (done ? 'ev.st.allPlayedPlace' : 'ev.st.allPlayedNow') : 'ev.st.allPlayed', {group:lab, ord:pos ? ordinal(pos) : ''});
  if(done && state.knockout) s += ' · '+T('ev.st.notInKo');
  return s;
}

/* ---------- Player page, Me tab, Following tab ---------- */
function miniGroupHTML(g, id){
  if(!g.gameStarted){
    return '<p class="empty">'+T('ev.inGroup', {names:g.entryIds.map(function(x){ return escapeHtml(entryName(x)); }).join(', ')})+'</p>';
  }
  var st = computeStandings(g), q = state.format.formatType==='rrknockout' ? (state.format.qualifiersPerGroup||0) : 0;
  var rows = st.map(function(r){
    return '<tr'+(r.id===id ? ' class="is-me"' : '')+'><td'+(q && r.position<=q ? ' class="q"' : '')+'>'+r.position+'</td>'+
      '<td class="n tap" data-eid="'+escapeHtml(r.id)+'">'+escapeHtml(entryName(r.id))+'</td><td>'+r.played+'</td><td>'+fmtLegDiff(r.legsFor-r.legsAgainst)+'</td><td><b>'+r.pts+'</b></td></tr>';
  }).join('');
  return '<table class="mini"><thead><tr><th>#</th><th class="n">'+escapeHtml(T('r.th.entry'))+'</th><th>'+escapeHtml(T('r.th.mp'))+'</th><th>'+escapeHtml(T('r.th.diff'))+'</th><th>'+escapeHtml(T('r.th.pts'))+'</th></tr></thead><tbody>'+rows+'</tbody></table>'+
    (q ? '<p class="note" style="margin:8px 0 0">'+escapeHtml(T('ev.greenBar'))+'</p>' : '');
}
function matchesHTML(id){
  var rows = [], gr = groupRows(id);
  if(gr && gr.g.gameStarted){
    gr.rows.forEach(function(r){
      var res = !r.played ? {txt:T('ev.res.toPlay'), cls:'t'} : resultOf(r.my>r.op ? 'won' : r.my<r.op ? 'lost' : 'drew', r.my, r.op, r.wo);
      rows.push('<div class="mrow"><span class="tap" data-eid="'+escapeHtml(r.opp)+'">'+escapeHtml(T('ev.vs', {name:entryName(r.opp)}))+'</span>'+resultHTML(res)+'</div>');
    });
  }
  koLines(id).forEach(function(l){
    var opp = koOpponent(l, id), res = koResultText(l, id);
    var info = bpMatchInfo(bpKeyOf(l.b), l.ri, l.mi);
    rows.push('<div class="mrow"><span>'+escapeHtml((state.format.formatType==='podknockout' ? l.title+' · ' : '')+l.round)+' <span class="note">'+escapeHtml(l.tag)+'</span>'+(info ? ' · '+escapeHtml(T('ev.board', {b:info.board})) : '')+
      (opp ? ' · <span class="tap" data-eid="'+escapeHtml(opp)+'">'+escapeHtml(T('ev.vs', {name:entryName(opp)}))+'</span>' : '')+'</span>'+resultHTML(res)+'</div>');
  });
  return rows.length ? rows.join('') : '<p class="empty">'+escapeHtml(T('ev.noMatches'))+'</p>';
}
/* Big-number tiles under the status line: position, points, leg difference. */
function tilesHTML(g, id){
  if(!g || !g.gameStarted) return '<div style="height:12px"></div>';
  var r = computeStandings(g).find(function(s){ return s.id===id; });
  if(!r) return '<div style="height:12px"></div>';
  return '<div class="tiles"><div class="tile"><b>'+escapeHtml(ordinal(r.position))+'</b><span>'+escapeHtml(T('ev.tile.pos'))+'</span></div>'+
    '<div class="tile"><b>'+r.pts+'</b><span>'+escapeHtml(T('ev.tile.pts'))+'</span></div>'+
    '<div class="tile"><b>'+fmtLegDiff(r.legsFor-r.legsAgainst)+'</b><span>'+escapeHtml(T('ev.tile.diff'))+'</span></div></div>';
}
function playerPageHTML(id, opts){
  var e = entryObj(id);
  if(!e) return '<section class="card"><p class="empty">'+TE('ev.notFound')+'</p></section>';
  var g = groupOf(id), me = myId()===id, fol = isFollowing(id);
  var sub = [e.org, g ? groupLabel(g.label) : '', g ? boardLabel(g) : '', g ? '' : podPlace(id, true)].filter(Boolean).join(' · ');
  var safe = escapeHtml(id);
  var html = '<section class="card pcard'+(me ? ' is-me' : '')+'">'+
    ((opts && opts.back) ? '<a class="back" href="#" data-act="back">'+escapeHtml(T('ev.back'))+'</a><br>' : '')+
    '<h2>'+escapeHtml(e.name)+(me ? ' <span class="you">'+escapeHtml(T('ev.you'))+'</span>' : '')+'</h2>'+
    (sub ? '<div class="psub">'+escapeHtml(sub)+'</div>' : '')+
    '<div class="pstatus">'+escapeHtml(statusLine(id))+'</div>'+
    boardLineHTML(id)+
    tilesHTML(g, id)+
    '<div class="pbtns">'+
      (me ? '<button type="button" class="pb blue on" data-act="notme">'+escapeHtml(T('ev.me.on'))+'</button>'
          : '<button type="button" class="pb blue" data-act="me" data-id="'+safe+'">'+escapeHtml(T('ev.me.btn'))+'</button>'+
            '<button type="button" class="pb gold'+(fol ? ' on' : '')+'" data-act="follow" data-id="'+safe+'">'+escapeHtml(T(fol ? 'ev.fol.on' : 'ev.fol.btn'))+'</button>')+
    '</div>'+
    '<p class="note" style="margin:8px 0 0">'+escapeHtml(T('ev.savedHere'))+'</p></section>';
  var rest = '';
  if(g) rest += '<section class="card"><h2>'+escapeHtml(groupLabel(g.label))+'</h2>'+miniGroupHTML(g, id)+'</section>';
  rest += '<section class="card"><h2>'+escapeHtml(T('ev.matches'))+'</h2>'+matchesHTML(id)+'</section>';
  return '<div class="pgrid"><div>'+html+'</div><div>'+rest+'</div></div>';
}
function meHTML(){
  var id = myId();
  if(!id) return '<section class="card"><h2>'+escapeHtml(T('ev.me.title'))+'</h2><p class="empty">'+TE('ev.me.empty', {btn:escapeHtml(T('ev.me.btn'))})+'</p></section>';
  return playerPageHTML(id, {});
}
function followingHTML(){
  var ids = followIds();
  if(!ids.length) return '<section class="card"><h2>'+escapeHtml(T('ev.fol.title'))+'</h2><p class="empty">'+TE('ev.fol.empty', {btn:escapeHtml(T('ev.fol.word'))})+'</p><p class="note">'+escapeHtml(T('ev.savedHere'))+'</p></section>';
  return '<div class="fgrid">'+ids.map(function(id){
    var g = groupOf(id), pos = g ? positionIn(g, id) : null;
    var sub = [(entryObj(id)||{}).org, g ? groupLabel(g.label)+(pos ? ' · '+ordinal(pos) : '') : podPlace(id, true)].filter(Boolean).join(' · ');
    return '<div class="fcard"><div class="fmain" data-eid="'+escapeHtml(id)+'"><b>'+escapeHtml(entryName(id))+'</b>'+
      (sub ? '<div class="psub">'+escapeHtml(sub)+'</div>' : '')+'<div class="fst">'+escapeHtml(statusLine(id))+'</div></div>'+
      '<button type="button" class="unf" data-act="follow" data-id="'+escapeHtml(id)+'" aria-label="'+escapeHtml(T('ev.fol.stop', {name:entryName(id)}))+'">★</button></div>';
  }).join('')+'</div>';
}

/* ---------- Tabs and routing (the address after # picks the screen) ---------- */
function availableTabs(){
  var t = [], hasGroups = state.format.formatType!=='knockout' && (state.groups||[]).length, hasKo = !!(state.knockout || state.knockoutLosers || (state.pods||[]).length);
  if(!hasGroups && !hasKo) return t;
  if(state.entriesList.length){ t.push('me'); t.push('following'); }
  if(hasGroups) t.push('groups');
  if(state.format.formatType==='podknockout' && state.boardPlan && Object.keys(state.boardPlan.boards||{}).length) t.push('boards');
  if(hasKo) t.push('bracket');
  return t;
}
/* The tab for the part of the event being played now (kb-review S-P0-4), when the address names no tab:
   - Round robin: Groups.  Knockout: Bracket.
   - Round robin + knockout: Groups until the knockout is drawn (it is drawn once every group is finished), then Bracket.
   - Group Boards: Boards while any group is still playing (or, with no board schedule, the Bracket tab, which then opens on
     All groups rather than an empty Finals: defaultPodSel), and the Bracket tab on the Finals once every group is done.
   - Finished or finalized: the same rules land on the Bracket (winner banner) or, for a round robin, the final tables. */
function anyPodPlaying(){ return (state.pods||[]).some(function(p){ return !podFinished(p); }); }
function stageTab(tabs){
  var type = state.format.formatType, has = function(t){ return tabs.indexOf(t)!==-1; }, pick;
  if(type==='roundrobin') pick = 'groups';
  else if(type==='knockout') pick = 'bracket';
  else if(type==='rrknockout') pick = state.knockout ? 'bracket' : 'groups';
  else if(type==='podknockout') pick = anyPodPlaying() && has('boards') ? 'boards' : 'bracket';
  if(pick && has(pick)) return pick;
  return has('groups') ? 'groups' : has('bracket') ? 'bracket' : tabs[0];
}
/* The stage tab this visit first opened on. Kept (in memory only) while the address names no tab, so a refresh in the
   background never moves someone who is reading; a reload works it out again. */
var landingTab = null;
function defaultTab(tabs){
  if(myId() && tabs.indexOf('me')!==-1) return 'me';
  if(followIds().length) return 'following';
  if(landingTab && tabs.indexOf(landingTab)!==-1) return landingTab;
  return stageTab(tabs);
}
/* Group Boards, the Bracket tab's first view: the Finals once every group is finished, otherwise the viewer's own group
   (when set as Me and still playing) or All groups. Chosen once; the picker, a stage card or an address changes it after. */
function defaultPodSel(){
  var pods = state.pods||[];
  if(!pods.length || !anyPodPlaying()) return state.knockout ? 'finals' : 'all';
  var mine = myId() ? pods.find(function(p){ return p.entryIds.indexOf(myId())!==-1 && !podFinished(p); }) : null;
  return mine ? mine.id : 'all';
}
/* True when the address after # names a screen (a tab, a group or bracket view, or a player). */
function addressNamesScreen(tabs){
  var h = (location.hash||'').replace(/^#\/?/, '').split('?')[0];
  return /^p\/./.test(h) || tabs.indexOf(h)!==-1 || /^(groups|bracket)\/./.test(h);
}
function currentRoute(tabs){
  var raw = (location.hash||'').replace(/^#\/?/, ''), tv = /[?&]tv=1(&|$)/.test(raw), h = raw.split('?')[0], m = /^p\/(.+)$/.exec(h);
  if(m){ var pid; try{ pid = decodeURIComponent(m[1]); }catch(e){ pid = m[1]; } return {name:'p', id:pid}; }
  var sub = /^(groups|bracket)\/(.+)$/.exec(h);
  if(sub && tabs.indexOf(sub[1])!==-1){ var sel; try{ sel = decodeURIComponent(sub[2]); }catch(e){ sel = sub[2]; } return {name:sub[1], sel:sel, tv:false}; }
  var name = tabs.indexOf(h)!==-1 ? h : defaultTab(tabs);
  return {name:name, tv:(tv && name==='boards' && h==='boards')};   // TV mode only when the address itself names the Boards tab
}
/* The Group Boards screen a #/bracket/... address names: 'finals', or the group labelled in 'group-<label>'. The codes on the
   printed sheets use these addresses, and so does #/groups/A for one round-robin group. One that names something this event
   doesn't have just shows the whole tab. Applied once per address, so the picker still works afterwards. */
var appliedSel = null;
/* All the groups, or only the one a #/groups/<label> address names (with a way back to the rest). */
function groupsTabHTML(label){
  var one = label ? state.groups.find(function(g){ return g.label===label; }) : null;
  return one ? '<a class="back" href="#/groups">'+escapeHtml(T('ev.allGroupsBack'))+'</a>'+qualifyLineHTML()+groupCardHTML(one) : qualifyLineHTML()+state.groups.map(groupCardHTML).join('');
}
function applyBracketSel(r){
  if(r.name!=='bracket' || !r.sel){ appliedSel = null; return; }
  if(appliedSel===r.sel) return;
  appliedSel = r.sel;
  var lm = /^group-(.+)$/.exec(r.sel), p = lm ? (state.pods||[]).find(function(x){ return x.label===lm[1]; }) : null;
  if(p) podSel = p.id; else if(r.sel==='finals') podSel = 'finals';
}
function tabLabel(t){ return T('ev.tab.'+t); }

/* Make names in tables and brackets tappable, and mark Me / Following. */
function markEntry(row, cell, id){
  cell.setAttribute('data-eid', id); cell.classList.add('tap');
  if(row){ row.classList.remove('is-me', 'is-fol'); if(id===myId()) row.classList.add('is-me'); else if(isFollowing(id)) row.classList.add('is-fol'); }
}
function decorate(){
  document.querySelectorAll('[data-gid]').forEach(function(card){
    var g = (state.groups||[]).find(function(x){ return x.id===card.getAttribute('data-gid'); });
    if(!g || !g.gameStarted) return;
    var st = computeStandings(g);
    card.querySelectorAll('.std-table tbody tr').forEach(function(tr, i){ var c = tr.querySelector('td.l'); if(c && st[i]) markEntry(tr, c, st[i].id); });
    var ids = g.entryIds.filter(function(id){ return entryObj(id); });
    card.querySelectorAll('.grid tbody tr').forEach(function(tr, i){ var c = tr.querySelector('td.name'); if(c && ids[i]) markEntry(tr, c, ids[i]); });
  });
  document.querySelectorAll('[data-bracket]').forEach(function(box){
    var b = bracketForKey(box.getAttribute('data-bracket'));
    if(!b || !b.rounds) return;
    var byName = {}, dup = {};
    b.rounds.forEach(function(round){ round.forEach(function(m){ [m.aEntryId, m.bEntryId].forEach(function(id){
      if(!id || !entryObj(id)) return;
      var n = entryObj(id).name;
      if(byName[n] && byName[n]!==id) dup[n] = true; else byName[n] = id;
    }); }); });
    box.querySelectorAll('span').forEach(function(sp){
      if(sp.children.length) return;
      var n = sp.textContent, id = byName[n];
      if(!id || dup[n]) return;
      markEntry(null, sp, id);
      var boxEl = sp.parentElement;
      if(id===myId()) boxEl.style.outline = '2px solid var(--blue)';
      else if(isFollowing(id)) boxEl.style.outline = '2px solid var(--gold)';
    });
  });
}

/* The finder sits outside #app so typing isn't interrupted by the 20s refresh. */
function showFinderResults(){
  var box = el('finderResults'), q = el('finder').value.trim().toLowerCase();
  if(!q || !state){ box.innerHTML = ''; return; }
  var hits = state.entriesList.filter(function(e){ return (e.name||'').toLowerCase().indexOf(q)!==-1 || (e.org||'').toLowerCase().indexOf(q)!==-1; }).slice(0, 8);
  box.innerHTML = hits.length ? hits.map(function(e){
    var g = groupOf(e.id), sub = [e.org, g ? groupLabel(g.label) : podPlace(e.id, false)].filter(Boolean).join(' · ');
    return '<button type="button" class="fres" data-eid="'+escapeHtml(e.id)+'"><span>'+escapeHtml(e.name)+(myId()===e.id ? ' <span class="you">'+escapeHtml(T('ev.you'))+'</span>' : isFollowing(e.id) ? ' ★' : '')+'</span><span class="sub">'+escapeHtml(sub)+'</span></button>';
  }).join('') : '<div class="fnone">'+escapeHtml(TE('ev.find.none'))+'</div>';
}

/* Compact results grid: row entry's legs first, same orientation rule the organiser chart uses. */
function resultsGridHTML(g){
  var ids = g.entryIds.filter(function(id){ return state.entriesList.some(function(e){ return e.id===id; }); });
  var head = '<tr><th></th>' + ids.map(function(_,i){ return '<th>'+(i+1)+'</th>'; }).join('') + '</tr>';
  var rows = ids.map(function(rowId, ri){
    var cells = ids.map(function(colId, ci){
      if(rowId===colId) return '<td class="diag"></td>';
      var sc = getScore(g, rowId, colId);
      if(!sc || sc.legs1===undefined || sc.legs1==='' || sc.legs2===undefined || sc.legs2==='') return '<td>·</td>';
      var first = rowId < colId;
      var my = parseInt(first ? sc.legs1 : sc.legs2), opp = parseInt(first ? sc.legs2 : sc.legs1);
      if(isNaN(my) || isNaN(opp)) return '<td>·</td>';
      var cls = my>opp ? 'win' : my<opp ? 'loss' : 'draw';
      return '<td class="'+cls+'">'+my+'–'+opp+(sc.wo?' <small>'+escapeHtml(T('r.wo'))+'</small>':'')+'</td>';
    }).join('');
    return '<tr><td class="name">'+(ri+1)+'. '+escapeHtml(entryName(rowId))+'</td>'+cells+'</tr>';
  }).join('');
  return '<div class="scroll"><table class="grid"><thead>'+head+'</thead><tbody>'+rows+'</tbody></table></div>';
}

/* ---------- Who goes through (round robin + knockout only) ----------
   The organiser's draw takes the top qualifiersPerGroup rows of each group's standings into the knockout (collectQualifiers in
   the app), and with a Plate pool the next plateQualifiersPerGroup rows (or everyone left) into the Plate. */
function qualifiersPerGroup(){
  if(!state || !state.format || state.format.formatType!=='rrknockout') return 0;
  return Math.max(1, parseInt(state.format.qualifiersPerGroup, 10) || 2);
}
function plateRuleText(q){
  if(!state.format.losersPool) return '';
  var cap = parseInt(state.format.plateQualifiersPerGroup, 10);
  if(cap >= 1) return cap===1 ? T('ev.q.plateOne', {p:q+1}) : T('ev.q.plateRange', {a:q+1, b:q+cap});
  return T('ev.q.plateAll');
}
function qualifyLineHTML(){
  var q = qualifiersPerGroup();
  if(!q || !(state.groups||[]).length) return '';
  var drawn = !!state.knockout;
  var main = T((q===1 ? 'ev.q.one' : 'ev.q.top')+(drawn ? 'Done' : ''), {n:q});
  var plate = plateRuleText(q);
  return '<p class="qline"><span class="qbar" aria-hidden="true"></span><span><b>'+escapeHtml(main)+'</b>'+(plate ? ' '+escapeHtml(plate) : '')+
    ' <span class="qkey">'+escapeHtml(T(drawn ? 'ev.q.keyDone' : 'ev.q.key'))+'</span></span></p>';
}
/* The standings table with the places that go through marked (a green bar on the position, and words for a screen reader). */
function markedStandingsHTML(g, st){
  var q = qualifiersPerGroup(), i = 0;
  var html = standingsTableHTML(g, st);
  if(!q) return html;
  return html.replace(/<td class="pos">([^<]*)<\/td>/g, function(all, pos){
    return (i++ < q) ? '<td class="pos q">'+pos+'<span class="sr"> ('+escapeHtml(T('ev.q.sr'))+')</span></td>' : all;
  });
}

/* ---------- Keys under tables and brackets: a tappable "What do ... mean?" that opens a short legend ----------
   Works on phones (no tooltips needed) and with the keyboard (a real button with aria-expanded). Which keys are open is
   kept for this visit, and in sessionStorage when the browser allows it, so a refresh does not close them. */
var KEY_STORE = 'dartdraw.viewer.keysOpen';
var keysOpen = loadKeysOpen();
function loadKeysOpen(){
  try{ var v = JSON.parse(sessionStorage.getItem(KEY_STORE) || '{}'); return v && typeof v === 'object' && !Array.isArray(v) ? v : {}; }catch(e){ return {}; }
}
function setKeyOpen(id, open){
  if(open) keysOpen[id] = 1; else delete keysOpen[id];

function keyDomId(id){ return 'key-'+String(id).replace(/[^A-Za-z0-9_-]/g, '_'); }

function keyLinksHTML(anchor){

function tableKeyHTML(g, st){

function bracketKeyHTML(b, key){
  var items = [], seeds = [], any = { bye:false, wo:false, nil:false, from:false, pod:false };
  b.rounds.forEach(function(round, ri){ round.forEach(function(m, mi){
    if(m.bye) any.bye = true;
    if(m.wo && m.winnerId) any.wo = true;
    if(m.void) any.nil = true;
    if(ri>0 && (!m.aEntryId || !m.bEntryId)) any.from = true;
    if(m.aFromPod || m.bFromPod) any.pod = true;
    if(ri===0) ['a','b'].forEach(function(s){ var id = m[s+'EntryId'], sd = id ? bracketSeedForDisplay(state, b.seeds, b.seedLabels, id) : null; if(sd) seeds.push(String(sd)); });
  }); });
  if(seeds.length){
    if(seeds.every(function(s){ return /^\d+$/.test(s); })) items.push(['1, 2 …', T('ev.key.seed')]);
    else {
      var sm = /^(.*?)(\d+)$/.exec(seeds[0]);
      items.push([escapeHtml(seeds[0]), sm && sm[1] ? T('ev.key.seedGroupEx', {label:escapeHtml(seeds[0]), g:escapeHtml(sm[1]), ord:escapeHtml(ordinal(parseInt(sm[2], 10)))}) : T('ev.key.seedGroup')]);
    }
  }
  var t0 = koMatchTag(b, state, 0, b.rounds[0].length>1 ? 1 : 0), rm = /(\d+)-(\d+)$/.exec(t0) || [t0, t0, ''];
  var cv = {r:rm[1], m:rm[2], g:escapeHtml(b.podLabel || '')};
  items.push([escapeHtml(t0), T(b.podLabel ? 'ev.key.codePod' : b===state.knockoutLosers ? 'ev.key.codePlate' : 'ev.key.code', cv)]);
  if(any.from) items.push([escapeHtml(T('ev.key.from')), T('ev.key.fromText')]);
  if(any.pod) items.push([escapeHtml(T('ev.key.pod')), T('ev.key.podText')]);
  if(any.bye) items.push([escapeHtml(T('ev.key.bye')), T('ev.key.byeText')]);
  if(any.wo) items.push([escapeHtml(T('r.wo')), TE('ev.key.woText')]);
  if(any.nil) items.push([escapeHtml(T('r.noShow')), T('ev.key.noShowText')]);
  return keyToggleHTML('b:'+key, T('ev.key.labels'), items, keyLinksHTML('q-match-labels'));
}

/* ---------- Group Boards: pick Finals, all groups, or one group ---------- */
var podSel = null;   // 'finals' | 'all' | a group id; null until the first view picks it (defaultPodSel)

function podsAllHTML(){

  }).join('')+'</div></section>';

function podsBracketTabHTML(){
  if(podSel==null) podSel = defaultPodSel();
  var pods = state.pods||[], sel = pods.find(function(p){ return p.id===podSel; });
  if(podSel==='finals' && !state.knockout) podSel = 'all';

  var html = podsPickerHTML();
  if(podSel==='all') html += podsAllHTML();

  else html += bracketCardHTML(sel.bracket, 'pod:'+sel.id, [groupLabel(sel.label), sel.boards && sel.boards.length ? T('ev.board', {b:sel.boards.join(', ')}) : '', podStartLine(sel)].filter(Boolean).join(' · '));
  return html;

function bracketForKey(key){
  if(key==='kol') return state.knockoutLosers;
  if(key==='ko') return state.knockout;
  var m = /^pod:(.+)$/.exec(key||''), p = m ? (state.pods||[]).find(function(x){ return x.id===m[1]; }) : null;
  return p ? p.bracket : null;

/* ---------- Board schedule (Group Boards): the plan comes ready-made from the organiser in state.boardPlan ---------- */
var _bpIdxFor = null, _bpIdx = null;
/* "key|round|match" -> { board, e (the plan entry), ahead (not-done entries before it on its board) } */
function bpIndex(){
  var bp = state.boardPlan;
  if(!bp || !bp.boards) return {};
  if(_bpIdxFor === bp) return _bpIdx;
  var idx = {};
  Object.keys(bp.boards).forEach(function(b){
    var ahead = 0;
    bp.boards[b].forEach(function(e){
      idx[e.key+'|'+e.ri+'|'+e.mi] = { board:b, e:e, ahead:(e.status === 'done' ? 0 : ahead) };
      if(e.status !== 'done') ahead++;
    });
  });
  _bpIdxFor = bp; _bpIdx = idx;
  return idx;
}
function bpMatchInfo(key, ri, mi){ return bpIndex()[key+'|'+ri+'|'+mi] || null; }
/* The plan key of a bracket object: 'ko' for the Finals, 'pod:<id>' for a group. */
function bpKeyOf(b){
  if(!b) return null;
  if(b === state.knockout) return 'ko';
  var p = (state.pods||[]).find(function(x){ return x.bracket === b; });
  return p ? 'pod:'+p.id : null;
}
function estLabel(ms){ return '~'+ddClock(new Date(ms)); }
function bpMatchOfEntry(e){ var b = bracketForKey(e.key); return b && b.rounds[e.ri] ? b.rounds[e.ri][e.mi] : null; }
function bpSideText(m, side){
  var id = m[side+'EntryId'], from = m[side+'FromPod'];
  if(id) return entryName(id);
  if(from){ var p = (state.pods||[]).find(function(x){ return x.id===from; }); return p && bracketIsVoidFinal(p.bracket) ? T('r.podNoWinner', {g:p.label}) : T('r.podWinner', {g:p ? p.label : '?'}); }
  return T('ev.slot.tbd');
}
function bpMatchText(e){ var m = bpMatchOfEntry(e); return m ? T('ev.match.v', {a:bpSideText(m, 'a'), b:bpSideText(m, 'b')}) : ''; }
function bpWhereText(e){
  var b = bracketForKey(e.key), round = b ? koRoundName(b, e.ri) : '';
  if(e.key==='ko') return T('ev.pod.finals')+' · '+round;
  var p = (state.pods||[]).find(function(x){ return 'pod:'+x.id===e.key; });
  return groupLabel(p ? p.label : '?')+' · '+round;
}
function boardCardHTML(b, entries){
  var pending = entries.filter(function(e){ return e.status !== 'done'; });
  var up = pending[0], more = pending.slice(1, 3), rest = pending.length - 1 - more.length;
  var html = '<section class="card bcard"><h2>'+escapeHtml(T('ev.board', {b:b}))+' <span class="sub">'+escapeHtml(pending.length ? T('ev.bd.toPlay', {n:pending.length}) : T('ev.bd.finished'))+'</span></h2>';
  if(!up) return html+'<p class="empty">'+escapeHtml(T('ev.bd.allDone'))+'</p></section>';
  var head = up.called ? T('ev.bd.called', {b:b}) : T(up.ready ? 'ev.bd.upNow' : 'ev.bd.waiting');
  html += '<div class="bup'+(up.called ? ' called' : '')+'"><b>'+escapeHtml(head)+'</b>'+
    '<div class="bm">'+escapeHtml(bpMatchText(up))+'</div><div class="note">'+escapeHtml(bpWhereText(up))+'</div></div>';
  more.forEach(function(e){
    html += '<div class="bnext"><span>'+(e.called ? '<b class="calledtag">'+escapeHtml(T('ev.bd.called', {b:b}))+'</b>' : '<b>'+escapeHtml(T('ev.bd.next'))+'</b>')+' '+escapeHtml(bpMatchText(e))+'<span class="note"> · '+escapeHtml(bpWhereText(e))+'</span></span>'+
      '<span class="bt">'+(e.estMs != null ? escapeHtml(estLabel(e.estMs)) : '')+'</span></div>';
  });
  if(rest > 0) html += '<p class="note" style="margin:8px 0 0">'+escapeHtml(T('ev.bd.more', {n:rest}))+'</p>';
  return html+'</section>';
}
var TV_PER_PAGE = 6, tvPage = 0, tvTimer = null;
function boardsTabHTML(tv){
  var bp = state.boardPlan;
  var nums = Object.keys((bp && bp.boards) || {}).sort(function(a, b){ return a - b; });
  if(!nums.length) return '<section class="card"><p class="empty">'+T('ev.bd.none')+'</p></section>';
  var pages = 1, list = nums;
  if(tv){
    pages = Math.max(1, Math.ceil(nums.length / TV_PER_PAGE));
    var page = tvPage % pages;
    list = nums.slice(page * TV_PER_PAGE, (page + 1) * TV_PER_PAGE);
  }
  var head = tv && pages > 1 ? '<p class="note tvpage">'+escapeHtml(T('ev.bd.page', {p:(tvPage % pages) + 1, n:pages}))+'</p>' : '';
  return head+'<div class="bgrid">'+list.map(function(b){ return boardCardHTML(b, bp.boards[b]); }).join('')+'</div>';
}
/* The player's next not-done match on any board: { board, ahead, e }, or null. */
function bpPlayerNext(id){
  var bp = state.boardPlan, best = null;
  if(!bp || !bp.boards) return null;
  Object.keys(bp.boards).forEach(function(b){
    var ahead = 0;
    bp.boards[b].forEach(function(e){
      if(e.status === 'done') return;
      var m = bpMatchOfEntry(e);
      if(m && (m.aEntryId === id || m.bEntryId === id) && (!best || ahead < best.ahead)) best = { board:b, ahead:ahead, e:e };
      ahead++;
    });
  });
  return best;
}
function boardLineHTML(id){
  var n = bpPlayerNext(id);
  if(!n) return '';
  var text;
  if(n.e.called) text = T('ev.bd.called', {b:n.board});
  else if(n.e.status === 'up') text = T(n.e.ready ? 'ev.bd.upNowOn' : 'ev.bd.waitingOn', {b:n.board});
  else text = [T('ev.bd.ahead', {b:n.board, n:n.ahead}), n.e.estMs != null ? estLabel(n.e.estMs) : ''].filter(Boolean).join(' · ');
  return '<div class="pboard'+(n.e.called ? ' called' : '')+'">'+escapeHtml(text)+'</div>';
}
/* "starts ~7:10 pm" for a group that has not begun and has an estimate; empty otherwise. */
function podStartLine(p){
  var bp = state.boardPlan;
  if(!bp || !bp.boards) return '';
  var key = 'pod:'+p.id, est = null, started = false;
  Object.keys(bp.boards).forEach(function(b){ bp.boards[b].forEach(function(e){
    if(e.key !== key) return;
    if(e.status === 'done' || e.status === 'up') started = true;
    if(e.estMs != null && (est == null || e.estMs < est)) est = e.estMs;
  }); });
  return (!started && est != null) ? T('ev.pod.starts', {time:estLabel(est)}) : '';
}

function bracketCardHTML(bracket, key, title){
  var champ = bracketIsComplete(bracket) ? bracketChampion(bracket) : null;
  var runner = champ ? bracketRunnerUp(bracket) : null;
  return '<section class="card" id="'+key+'"><h2>'+escapeHtml(title)+'</h2>'+
    (champ ? '<div class="champ"><b>'+escapeHtml(T('ev.br.winner', {name:entryName(champ)}))+'</b>'+(runner?'<div>'+escapeHtml(T('ev.br.runnerUp', {name:entryName(runner)}))+'</div>':'')+'</div>' : '')+

    bracketKeyHTML(bracket, key)+

/* ---------- Bracket as rounds: one round at a time, big match cards (default on phones) ---------- */
var BVIEW_KEY = 'dartdraw.viewer.bracketView';
var bracketPref = loadBracketPref();   // 'rounds' | 'chart' | 'auto' (auto = rounds on phones, chart on wide screens)
var roundSel = {};                     // bracket key -> round the viewer picked (otherwise the current round)
function loadBracketPref(){ try{ var v = localStorage.getItem(BVIEW_KEY); return (v==='rounds' || v==='chart') ? v : 'auto'; }catch(e){ return 'auto'; } }
function setBracketView(v){ bracketPref = v; try{ localStorage.setItem(BVIEW_KEY, v); }catch(e){} }
function isNarrow(){ return window.matchMedia('(max-width: 699px)').matches; }
function bracketView(b){
  if(bracketPref!=='auto') return bracketPref;
  return (isNarrow() || (b && b.size>=32)) ? 'rounds' : 'chart';   // a 32+ draw is unreadable as a chart, even on a laptop

function bracketToolsHTML(key, view){
  var rounds = view==='rounds';

function matchIsPending(m){ return !m.winnerId && !m.bye && (m.aEntryId || m.bEntryId); }
function currentRoundIdx(b){
  for(var ri=0; ri<b.rounds.length; ri++){ if(b.rounds[ri].some(matchIsPending)) return ri; }
  return b.rounds.length-1;
}
/* The round buttons' short names: R16 / P16, Quarters, Semis, Final (in BM: P16, Suku akhir, Separuh akhir, Akhir; the
   row wraps on a phone rather than hiding a button off-screen). */
function roundShortName(b, ri){
  var r = koRoundInfo(b, ri);
  return T('ev.rd.'+r.code, {n:r.n});
}
function rsSlotHTML(b, ri, mi, side){
  var m = b.rounds[ri][mi], id = m[side+'EntryId'], legs = m[side+'Legs'];
  if(!id){
    var txt = T('ev.slot.tbd'), fromPod = m[side+'FromPod'];
    if(fromPod){ var pp = (state.pods||[]).find(function(p){ return p.id===fromPod; }); txt = (pp && bracketIsVoidFinal(pp.bracket)) ? T('r.podNoWinner', {g:pp.label}) : T('r.podWinner', {g:pp ? pp.label : '?'}); }
    else if(m.bye) txt = T('ev.mt.bye');
    else if(ri>0){ var fi = 2*mi + (side==='a' ? 0 : 1); if(b.rounds[ri-1][fi]) txt = T('ev.slot.winnerOf', {tag:koMatchTag(b, state, ri-1, fi)}); }
    return '<div class="rs ph"><span>'+escapeHtml(txt)+'</span></div>';
  }
  var won = !!m.winnerId && m.winnerId===id, lost = !!m.winnerId && !won;
  var who = id===myId() ? ' is-me' : isFollowing(id) ? ' is-fol' : '';

  return '<div class="rs'+(won ? ' won' : '')+(lost ? ' lost' : '')+who+'">'+
    (seed ? '<i class="sd">'+escapeHtml(String(seed))+'</i>' : '')+
    '<span class="tap" data-eid="'+escapeHtml(id)+'">'+(who===' is-fol' ? '★ ' : '')+escapeHtml(entryName(id))+'</span>'+
    (m.wo && lost ? '<small class="note wo">'+escapeHtml(T('ev.slot.noShow'))+'</small>' : '')+
    '<b>'+(legs!=null ? legs : '')+'</b></div>';
}
function rsMatchHTML(b, ri, mi){
  var m = b.rounds[ri][mi], tag = koMatchTag(b, state, ri, mi);
  var mt = function(cls, k){ return '<span class="mt '+cls+'">'+escapeHtml(T('ev.mt.'+k))+'</span>'; };
  var status = m.void ? mt('dim', (m.aEntryId || m.bEntryId) ? 'void' : 'notPlayed')
    : m.bye ? mt('dim', 'bye')
    : m.winnerId ? (m.wo ? mt('dim', 'wo') : '')
    : (m.aEntryId && m.bEntryId) ? mt('rdy', 'toPlay')
    : mt('dim', 'waiting');
  var mine = m.aEntryId===myId() || m.bEntryId===myId();
  var fol = !mine && (isFollowing(m.aEntryId) || isFollowing(m.bEntryId));
  var info = bpMatchInfo(bpKeyOf(b), ri, mi);
  return '<div class="rm'+(mine ? ' me' : fol ? ' fol' : '')+'"><div class="rmh"><span class="mtag">'+escapeHtml(tag)+'</span>'+(info ? '<span class="mbd">'+escapeHtml(T('ev.board', {b:info.board}))+'</span>' : '')+status+'</div>'+
    rsSlotHTML(b, ri, mi, 'a')+rsSlotHTML(b, ri, mi, 'b')+'</div>';
}
function roundsViewHTML(b, key){
  var sel = (roundSel[key]!=null && roundSel[key]<b.rounds.length) ? roundSel[key] : currentRoundIdx(b);
  var cur = currentRoundIdx(b);
  var seg = b.rounds.map(function(round, ri){
    var done = !round.some(matchIsPending) && round.some(function(m){ return m.winnerId; });
    return '<button type="button" data-round="'+key+'|'+ri+'" aria-pressed="'+(ri===sel)+'" class="'+(done ? 'done' : '')+'">'+escapeHtml(roundShortName(b, ri))+'</button>';
  }).join('');
  var round = b.rounds[sel], real = round.filter(function(m){ return !m.bye; });
  var finished = real.filter(function(m){ return m.winnerId; }).length;
  var cards = round.map(function(m, mi){ return rsMatchHTML(b, sel, mi); }).join('');
  return '<div class="rseg" role="group" aria-label="'+escapeHtml(T('ev.rd.group'))+'">'+seg+'</div>'+
    '<p class="note" style="margin:0 0 2px">'+escapeHtml([koRoundName(b, sel), T('ev.doneOf', {done:finished, n:real.length}), sel===cur && finished<real.length ? T('ev.rd.current') : ''].filter(Boolean).join(' · '))+'</p>'+cards;
}

/* Scale a bracket down to the screen width when "Fit to screen" is on. */
function applyBracketFit(){
  document.querySelectorAll('[data-bracket]').forEach(function(box){
    var art = box.querySelector('.mko-artboard');
    if(!art) return;
    var key = box.getAttribute('data-bracket');
    art.style.transformOrigin = 'top left';
    if(fitBracket[key]){
      var w = art.offsetWidth, scale = Math.min(1, box.clientWidth / w);
      art.style.transform = 'scale('+scale+')';
      box.style.height = Math.round(art.offsetHeight*scale)+'px';
      box.style.overflowX = 'hidden';
    } else { art.style.transform = ''; box.style.height = ''; box.style.overflowX = ''; }
  });
}

function progressText(){

/* Best-of-legs summary for the header. Mirrors the organiser's legsForKnockoutRound / koStageKey rules. */
var LEG_STAGES = ['early','quarterfinal','semifinal','final'];
function legInt(v){ var n = parseInt(v, 10); return n > 0 ? n : 0; }
function legStagesFor(bracket){
  var n = bracket && bracket.rounds && bracket.rounds.length;
  if(!(n > 0)) return LEG_STAGES.slice();
  var out = [];
  for(var i = 0; i < n; i++){
    var fromEnd = n - i;
    out.push(fromEnd === 1 ? 'final' : fromEnd === 2 ? 'semifinal' : fromEnd === 3 ? 'quarterfinal' : 'early');
  }
  return out.filter(function(st, i){ return out.indexOf(st) === i; });
}
// Legs for one stage of the main bracket ('main') or the Plate pool ('plate').
function legsForStage(f, which, stage){
  var flat = legInt(f.bestOfLegs) || 5;
  var cfg = f.knockoutLegs && typeof f.knockoutLegs === 'object' ? f.knockoutLegs[which] : null;
  if(which === 'plate') flat = (cfg && cfg.flatLegs != null ? legInt(cfg.flatLegs) : legInt(f.bestOfLegs)) || 5;
  if(cfg && cfg.variable) return legInt(cfg[stage]) || flat;
  return flat;
}
function koLegsText(f, which, bracket){
  var stages = legStagesFor(bracket);
  var vals = stages.map(function(st){ return legsForStage(f, which, st); });
  var last = vals.length - 1;
  var allSame = vals.every(function(v){ return v === vals[0]; });
  if(allSame) return T('ev.legs.flat', {n:vals[0]});
  var restSame = vals.slice(0, last).every(function(v){ return v === vals[0]; });
  if(restSame) return T('ev.legs.final', {n:vals[0], f:vals[last]});
  var groups = [];
  stages.forEach(function(st, i){
    var g = groups[groups.length - 1], name = T('ev.legs.st.'+st);
    if(g && g.v === vals[i]) g.names.push(name);
    else groups.push({ v: vals[i], names: [name] });
  });
  return groups.map(function(g){ return T('ev.legs.stages', {stages:g.names.join(' & '), n:g.v}); }).join(', ');
}
/* Teams: a match has several segments, so "best of N legs" means nothing. The header says how many segments a match has and
   whether the tie-breaker is played, for each stage that has one. Group Boards and the Plate pool follow the knockout tick.
   The counts come from the server (format.segmentCount and the two tie-breaker ticks); an older server sends none, so no line. */
function teamsParts(f){
  var n = parseInt(f.segmentCount, 10);
  if(!(n >= 1)) return [];
  var text = function(tb){ return T(tb ? 'ev.seg.tb' : 'ev.seg.plain', {n:n}); };
  var rr = f.segmentTieBreakerRR === true, ko = f.segmentTieBreakerKO === true;
  if(f.formatType === 'roundrobin') return [{ label:'', text:text(rr) }];
  if(f.formatType === 'knockout' || f.formatType === 'podknockout') return [{ label:'', text:text(ko) }];
  if(f.formatType === 'rrknockout') return rr === ko ? [{ label:'', text:text(ko) }] : [{ label:T('ev.legs.lab.rr'), text:text(rr) }, { label:T('ev.legs.lab.ko'), text:text(ko) }];
  return [];
}
function legsParts(s){
  var f = s && s.format;
  if(!f || typeof f !== 'object') return [];
  if(isTeamsEvent(s)) return teamsParts(f);
  var rr = T('ev.legs.flat', {n:legInt(f.bestOfLegs) || 5});
  var cap = function(t){ return t.charAt(0).toUpperCase() + t.slice(1); };
  var parts;
  if(f.formatType === 'roundrobin') parts = [{ label:'', text:rr }];
  else if(f.formatType === 'knockout') parts = [{ label:'', text:koLegsText(f, 'main', s.knockout) }];
  else if(f.formatType === 'rrknockout') parts = [{ label:T('ev.legs.lab.rr'), text:rr }, { label:T('ev.legs.lab.ko'), text:koLegsText(f, 'main', s.knockout) }];
  else if(f.formatType === 'podknockout'){
    var pod = legInt(f.podLegs) || legInt(f.bestOfLegs) || 5;
    var finals = s.knockout && s.knockout.podFinals ? s.knockout : null;
    parts = [{ label:T('ev.legs.lab.groups'), text:T('ev.legs.flat', {n:pod}) }, { label:T('ev.legs.lab.finals'), text:koLegsText(f, 'main', finals) }];
  } else return [];
  if(s.knockoutLosers && f.formatType === 'rrknockout') parts.push({ label:T('ev.legs.lab.plate'), text:koLegsText(f, 'plate', s.knockoutLosers) });
  parts.forEach(function(p){ if(!p.label) p.text = cap(p.text); });
  return parts;
}
function legsLine(s){
  return legsParts(s).map(function(p){ return p.label ? T('ev.legs.labeled', {label:p.label, text:p.text}) : p.text; }).join(' · ');
}

/* Stage cards for events with two stages (round robin + knockout, or Group Boards + Finals): each card is a link to that
   stage's tab and shows its status. Built from the server's `stages`; an older server (or none) just shows no cards. */
function stageStripHTML(r, tabs){
  if(r.tv || (r.name!=='groups' && r.name!=='boards' && r.name!=='bracket')) return '';
  var type = state.format.formatType;
  if(type!=='rrknockout' && type!=='podknockout') return '';
  var stages = hmKnownStages({stages:evStages});
  if(stages.length!==2 || stages[0].key!=='groups' || stages[1].key!==(type==='podknockout' ? 'finals' : 'knockout')) return '';
  var done = state.knockout && bracketIsComplete(state.knockout) ? bracketChampion(state.knockout) : null;
  var it = {format:type, unit:(state.eventCreation||{}).competitionUnit, winner:done ? bracketEntryName(state, done) : ''};
  var first = type==='podknockout' ? (tabs.indexOf('boards')!==-1 ? '#/boards' : (state.pods||[]).length ? '#/bracket/group-'+encodeURIComponent(state.pods[0].label) : '#/bracket') : '#/groups';
  var second = type==='podknockout' ? '#/bracket/finals' : '#/bracket';
  var onSecond = r.name==='bracket' && (type==='rrknockout' || podSel==='finals');
  var kind = it.winner ? 'results' : 'live';
  return '<div class="evstages" role="group" aria-label="'+escapeHtml(T('ev.stages'))+'">'+stages.map(function(s, i){
    var on = i===1 ? onSecond : !onSecond;
    var href = i===1 ? second : first, tab = href.split('/')[1], card = hmStageHTML(kind, it, s, i, 2);
    if(tabs.indexOf(tab)===-1 || (i===1 && !state.knockout)) return '<div class="evstage">'+card+'</div>';   // that stage has nothing to show yet (no knockout drawn)
    var sel = type==='podknockout' && href.indexOf('#/bracket/')===0 ? decodeURIComponent(href.slice(10)) : '';   // Group Boards: the bracket view this address picks
    return '<a class="evstage'+(on ? ' on' : '')+'" href="'+href+'"'+(sel ? ' data-stagesel="'+escapeHtml(sel)+'"' : '')+(on ? ' aria-current="page"' : '')+'>'+card+'</a>';
  }).join('')+'</div>';
}

/* "Open · Singles" / "Perseorangan Terbuka": the stored category and unit are English codes, shown through the tables as
   one phrase (BM puts the unit first). A value the tables do not know is shown as it was stored. */
function catUnitLabel(ec){
  var has = function(k){ return Object.prototype.hasOwnProperty.call(DD_TABLES.en, k); };
  var cat = ec.eventType ? (has('cat.'+ec.eventType) ? T('cat.'+ec.eventType) : String(ec.eventType)) : '';
  var unit = ec.competitionUnit ? (has('unit.'+ec.competitionUnit) ? T('unit.'+ec.competitionUnit) : String(ec.competitionUnit)) : '';
  return cat && unit ? T('ev.sub.catUnit', {cat:cat, unit:unit}) : (cat || unit);
}
function render(){
  var ec = state.eventCreation || {};
  document.title = T('page.titleEvent', {name:ec.eventName || ec.tournamentName || T('page.title')});
  el('hOver').textContent = ec.tournamentName || '';
  el('hTitle').textContent = ec.eventName || ec.tournamentName || T('ev.titleFallback');
  el('hSub').textContent = [catUnitLabel(ec), ddDateNum(ec.date)].filter(Boolean).join(' · ');
  el('hLegs').textContent = legsLine(state);
  el('finder').placeholder = TE('ev.find'); el('finder').setAttribute('aria-label', TE('ev.find'));
  var prog = progressText();
  el('hProgress').hidden = !prog; el('hProgress').textContent = prog;
  el('head').hidden = false;
  setVenueNote();

  // keep each bracket's horizontal scroll across refreshes
  var scrolls = {};
  document.querySelectorAll('[data-bracket]').forEach(function(b){ scrolls[b.getAttribute('data-bracket')] = b.scrollLeft; });

  var type = state.format.formatType;
  var tabs = availableTabs();
  if(!tabs.length){
    el('app').innerHTML = '<div class="card"><p class="empty">'+T('ev.noDraw')+'</p></div>';
    el('nav').hidden = true; el('finderWrap').hidden = true; el('startCard').hidden = true;
    return;
  }
  var r = currentRoute(tabs), body = '';
  if(!landingTab && r.name!=='me' && r.name!=='following' && r.name!=='p' && !addressNamesScreen(tabs)) landingTab = r.name;
  if(podSel==null && (state.pods||[]).length) podSel = defaultPodSel();
  if(!(r.name==='bracket' && r.sel)) appliedSel = null;
  if(r.name==='me') body = meHTML();
  else if(r.name==='following') body = followingHTML();
  else if(r.name==='p') body = playerPageHTML(r.id, {back:true});
  else if(r.name==='groups') body = groupsTabHTML(r.sel);
  else if(r.name==='boards') body = boardsTabHTML(!!r.tv);
  else if(r.name==='bracket'){
    applyBracketSel(r);
    if((state.pods||[]).length) body += podsBracketTabHTML();
    else {
      if(state.knockout) body += bracketCardHTML(state.knockout, 'ko', T(type==='rrknockout' ? 'ev.br.main' : 'ev.br.bracket'));
      if(state.knockoutLosers) body += bracketCardHTML(state.knockoutLosers, 'kol', T('ev.br.plate'));
    }
  }
  el('app').innerHTML = stageStripHTML(r, tabs) + body;
  var activeTab = r.name==='p' ? (r.id===myId() ? 'me' : '') : r.name;
  el('navLinks').innerHTML = tabs.map(function(t){
    var n = t==='following' ? followIds().length : 0;
    return '<a href="#/'+t+'"'+(t===activeTab ? ' class="on" aria-current="page"' : '')+'>'+escapeHtml(n ? T('ev.tab.count', {label:tabLabel(t), n:n}) : tabLabel(t))+'</a>';
  }).join('');
  document.body.classList.toggle('tv', !!r.tv);
  setStartCard(!!r.tv);
  el('nav').hidden = !!r.tv; el('finderWrap').hidden = !!r.tv || !state.entriesList.length;
  if(typeof setInterval === 'function'){
    if(r.tv && !tvTimer) tvTimer = setInterval(function(){ tvPage++; if(state) render(); }, 12000);
    if(!r.tv && tvTimer){ clearInterval(tvTimer); tvTimer = null; }
  }
  showFinderResults();
  decorate();
  applyBracketFit();
  document.querySelectorAll('[data-bracket]').forEach(function(b){ var k=b.getAttribute('data-bracket'); if(scrolls[k]) b.scrollLeft = scrolls[k]; });
}

function goToPlayer(id){
  el('finder').value = ''; el('finderResults').innerHTML = '';
  location.hash = '#/p/' + encodeURIComponent(id);
}
document.addEventListener('click', function(e){
  var t = e.target;
  if(!t || !t.closest) return;
  var ok = t.closest('[data-start-ok]');
  if(ok){ dismissStartCard(); return; }
  var st = t.closest('[data-start-toggle]');
  if(st){ toggleStartBar(st); return; }
  if(!state) return;
  var kb = t.closest('[data-key]');
  if(kb){   // open or close a key in place: no redraw, so the button keeps the keyboard focus
    var kid = kb.getAttribute('data-key'), open = kb.getAttribute('aria-expanded')!=='true', body = el(kb.getAttribute('aria-controls'));
    setKeyOpen(kid, open);
    kb.setAttribute('aria-expanded', open ? 'true' : 'false');
    if(body) body.hidden = !open;
    return;
  }
  var ss = t.closest('[data-stagesel]');   // a Group Boards stage card: pick that view even when the address does not change
  if(ss){
    var sv = ss.getAttribute('data-stagesel'), gm = /^group-(.+)$/.exec(sv), gp = gm ? (state.pods||[]).find(function(x){ return x.label===gm[1]; }) : null;
    if(gp) podSel = gp.id; else if(sv==='finals') podSel = 'finals';
    appliedSel = sv;
    if(location.hash === ss.getAttribute('href')){ e.preventDefault(); render(); return; }
  }
  var pd = t.closest('[data-pod]');
  if(pd){ podSel = pd.getAttribute('data-pod'); render(); window.scrollTo(0, 0); return; }
  var bv = t.closest('[data-bview]');
  if(bv){ setBracketView(bv.getAttribute('data-bview')); render(); return; }
  var rd = t.closest('[data-round]');
  if(rd){ var parts = rd.getAttribute('data-round').split('|'); roundSel[parts[0]] = parseInt(parts[1], 10); render(); return; }
  var fit = t.closest('[data-fit]');
  if(fit){ var k = fit.getAttribute('data-fit'); fitBracket[k] = !fitBracket[k]; render(); return; }
  var act = t.closest('[data-act]');
  if(act){
    e.preventDefault();
    var a = act.getAttribute('data-act'), id = act.getAttribute('data-id');
    if(a==='back'){ if(history.length>1) history.back(); else location.hash = '#/'; return; }
    if(a==='me') setMe(id); else if(a==='notme') clearMe(); else if(a==='follow') toggleFollow(id);
    render();
    return;
  }
  var go = t.closest('[data-eid]');
  if(go) goToPlayer(go.getAttribute('data-eid'));
});
window.addEventListener('hashchange', function(){ if(state){ render(); window.scrollTo(0, 0); } });
document.addEventListener('change', function(e){ if(e.target && e.target.id==='podSelect'){ podSel = e.target.value; render(); } });
el('finder').addEventListener('input', showFinderResults);
el('finder').addEventListener('keydown', function(e){
  if(e.key!=='Enter') return;
  var first = el('finderResults').querySelector('[data-eid]');
  if(first) goToPlayer(first.getAttribute('data-eid'));
});
var lastNarrow = isNarrow();
window.addEventListener('resize', function(){
  var n = isNarrow();
  if(n!==lastNarrow){ lastNarrow = n; if(state && bracketPref==='auto') render(); }
  applyBracketFit();
});

/* A whole-page message, by its table keys (kept, so a language switch can show it again). withHome: the "See all events" link. */
var shownMessage = null;
function showMessage(titleKey, textKey, withHome){
  shownMessage = [titleKey, textKey, !!withHome];
  el('head').hidden = true; el('nav').hidden = true; el('finderWrap').hidden = true; el('startCard').hidden = true;
  el('app').innerHTML = '<div class="msg"><h1>'+T(titleKey)+'</h1><p class="empty">'+T(textKey)+'</p>'+(withHome && typeof hmHomeLinkHTML === 'function' ? hmHomeLinkHTML() : '')+'</div>';
}
/* Has any match been played? A group score, or a bracket match with a winner (a bye does not count) or marked void.
   Until then the header says "Starting soon" rather than "Live". */
function bracketStarted(b){
  var rounds = b && Array.isArray(b.rounds) ? b.rounds : [];
  return rounds.some(function(r){
    return Array.isArray(r) && r.some(function(m){ return !!m && ((m.winnerId && !m.bye) || m.void); });
  });
}
function eventStarted(s){
  if(!s) return false;
  var groups = Array.isArray(s.groups) ? s.groups : [], pods = Array.isArray(s.pods) ? s.pods : [];
  if(groups.some(function(g){
    var sc = g && g.scores && typeof g.scores === 'object' ? g.scores : {};
    return Object.keys(sc).some(function(k){ return sc[k] && typeof sc[k] === 'object'; });
  })) return true;
  return bracketStarted(s.knockout) || bracketStarted(s.knockoutLosers) || pods.some(function(p){ return !!p && bracketStarted(p.bracket); });
}
/* "Scores last changed": the time the server last saved the event (updatedAt), as a clock time, with the date when it is not
   today. A missing or invalid time gives '' so the page never prints "Invalid Date" or NaN. */
function toDate(v){
  if(v == null || v === '' || v === 0) return null;
  var d = new Date(v);
  return isNaN(d.getTime()) ? null : d;
}
function clockShort(d){ return ddClock(d); }   // 2:32 pm / 2:32 PTG (Intl en-GB / ms-MY)
function changedLabel(v, now){
  var t = toDate(v);
  if(!t) return '';
  var n = toDate(now) || new Date(), hm = clockShort(t);
  if(t.getFullYear()===n.getFullYear() && t.getMonth()===n.getMonth() && t.getDate()===n.getDate()){
    var mins = Math.max(0, Math.floor((n.getTime() - t.getTime()) / 60000));
    return mins < 1 ? T('ev.chg.justNow', {time:hm}) : mins < 60 ? T('ev.chg.minAgo', {time:hm, n:mins}) : hm;
  }
  return T(t.getFullYear()!==n.getFullYear() ? 'ev.chg.otherYear' : 'ev.chg.otherDay', {d:t.getDate(), mon:ddMonth(t.getMonth()), y:t.getFullYear(), time:hm});
}
/* updatedAt: when the organiser last saved (from the server). lastOkAt: when this phone last reached the site. */
function statusPillHTML(started, stale, updatedAt, finished, lastOkAt, now){
  var chg = changedLabel(updatedAt, now), changed = chg ? ' ' + escapeHtml(T('ev.changed', {when:chg})) : '';
  var pill = function(cls, k, dot){ return '<span class="live-pill'+(cls ? ' '+cls : '')+'">'+(dot ? '<i></i>' : '')+escapeHtml(T('ev.pill.'+k))+'</span>'; };
  if(stale){
    var chk = toDate(lastOkAt);
    return pill('off', 'offline') + ' ' + escapeHtml(T('ev.offlineMsg')) + changed +
      (chk ? ' <span class="chk">' + escapeHtml(T('ev.checked', {time:clockShort(chk)})) + '</span>' : '');
  }
  if(finished) return pill('done', 'final') + changed;
  return started ? pill('', 'live', true) + changed : pill('soon', 'soon') + changed;
}
/* Events with no board or time on this page (everything except Group Boards): once the draw is made, and until the event is
   over, matches are called at the venue. Shown as one calm line under the status. */
function venueNoteNeeded(s){
  if(!s || !s.format || s.finalizedAt) return false;
  var type = s.format.formatType;
  if(type==='podknockout' || (s.pods||[]).length) return false;
  var groups = s.groups || [], hasGroups = type!=='knockout' && groups.length;
  if(!hasGroups && !s.knockout && !s.knockoutLosers) return false;                 // before the draw
  try{
    if(s.knockout) return !bracketIsComplete(s.knockout) && !bracketIsVoidFinal(s.knockout);
    return !groups.every(function(g){ return g.gameStarted && groupIsComplete(g); });
  }catch(e){ return false; }   // an odd or partial bracket: say nothing rather than guess
}
function setVenueNote(){
  var on = venueNoteNeeded(state), v = el('hVenue');
  v.hidden = !on;
  v.innerHTML = on ? escapeHtml(T('ev.venue'))+' <a href="'+escapeHtml(helpHref('q-when-where'))+'">'+escapeHtml(T('ev.venueMore'))+'</a>' : '';
}
/* "New here?" bar (home.js builds it): a slim line under the header, only for a first-time visitor who came straight in,
   from a QR code or a shared link, not from the home page (which shows its own card). Decided once per page view. The
   line opens the three points in place; the × hides it for good on this device. */
var startWanted = null, startOpen = false;
function cameFromOutside(){
  try{ var r = document.referrer; if(!r || typeof r !== 'string') return true; return new URL(r).origin !== location.origin; }catch(e){ return true; }
}
function setStartCard(tv){
  var box = el('startCard');
  if(typeof hmStartWanted !== 'function') return;
  if(startWanted === null) startWanted = hmStartWanted(hmStore()) && cameFromOutside();
  var on = startWanted && !tv && hmStartWanted(hmStore());
  box.hidden = !on;
  var html = on && typeof hmStartBarHTML === 'function' ? hmStartBarHTML({ help: helpHref(''), team: isTeamsEvent(), open: startOpen }) : '';
  if(startShownHTML !== html){ box.innerHTML = html; startShownHTML = html; }   // unchanged on a refresh: left alone, so focus stays
}
var startShownHTML = '';
function dismissStartCard(){
  if(typeof hmStartDismiss === 'function') hmStartDismiss(hmStore());
  startWanted = false; startShownHTML = '';
  var box = el('startCard'); box.hidden = true; box.innerHTML = '';
  var h = el('hTitle'); if(h && h.focus){ h.setAttribute('tabindex', '-1'); try{ h.focus({ preventScroll: true }); }catch(e){} }
}
function toggleStartBar(btn){   // open or close in place: no redraw, so the button keeps the keyboard focus
  startOpen = btn.getAttribute('aria-expanded') !== 'true';
  btn.setAttribute('aria-expanded', startOpen ? 'true' : 'false');
  var body = el(btn.getAttribute('aria-controls'));
  if(body) body.hidden = !startOpen;
  if(typeof hmStartBarHTML === 'function') startShownHTML = hmStartBarHTML({ help: helpHref(''), team: isTeamsEvent(), open: startOpen });   // so the next refresh leaves it as it is
}
function setStatus(){
  var stale = lastOkAt && (Date.now() - lastOkAt) > POLL_MS*3;
  var started = state ? eventStarted(state) : false;
  el('hStatus').innerHTML = statusPillHTML(started, stale, lastUpdatedAt, !!(state && state.finalizedAt), lastOkAt);   // Final results only once the organiser has finalized the event (the server sends finalizedAt only for a valid date)
}

async function load(){
  if(!SLUG){                                              // the bare address: the home page (home.js), or the plain message if that script did not load
    if(typeof showHome === 'function') showHome(); else showMessage('ev.msg.noLinkTitle', 'ev.msg.noLinkText');
    return false;
  }
  try{
    var res = await fetch('/api/public/'+encodeURIComponent(SLUG), {cache:'no-store'});
    if(res.status===404){
      // Keep polling: the organiser may republish, and the page should come back on its own.
      state = null; lastUpdatedAt = null;
      showMessage('ev.msg.goneTitle', 'ev.msg.goneText', true);
      return true;
    }
    if(!res.ok) throw new Error('HTTP '+res.status);
    var body = await res.json();
    lastOkAt = Date.now();
    evStages = Array.isArray(body.stages) ? body.stages : [];   // every poll, so a one-off empty answer does not hide the cards for good (shown on the next render)
    if(body.updatedAt !== lastUpdatedAt || !state){
      lastUpdatedAt = body.updatedAt;
      state = body.view;
      if(!state.tieBreakOrder) state.tieBreakOrder = ['Head-to-head result','Leg difference','Legs won','Organiser decision / playoff'];
      state.entriesList = state.entriesList || []; state.groups = state.groups || []; state.format = state.format || {};
      shownMessage = null;
      render();
    }
    setStatus();
    return true;
  }catch(e){
    if(!state) showMessage('ev.msg.failTitle', 'ev.msg.failText');
    setStatus();
    return true;
  }
}

/* EN | BM: the switch redraws the page in place. The address (tab, group, player), the open keys, the bracket view and
   round, Me / Following and the scroll position stay as they were. */
function relang(){
  var y = typeof window.scrollY === 'number' ? window.scrollY : 0;
  setHelpLinks();
  if(state) render();
  else if(shownMessage) showMessage(shownMessage[0], shownMessage[1], shownMessage[2]);
  else if(SLUG) document.title = T('page.title');
  setStatus();
  if(y && window.scrollTo) window.scrollTo(0, y);
}
if(typeof ddOnLang === 'function') ddOnLang(relang);
ddApplyStatic(); ddSyncSwitches();   // the header, footer and loading words in the reader's language from the start
if(SLUG) document.title = T('page.title');
if(typeof ddNoteUpdate === 'function') ddNoteUpdate();

var timer = null;
async function tick(){
  var keepGoing = await load();
  if(keepGoing) timer = setTimeout(tick, POLL_MS);
}
document.addEventListener('visibilitychange', function(){
  if(!document.hidden && SLUG){ clearTimeout(timer); tick(); }
});
tick();
</script>
</body>
