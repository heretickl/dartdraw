<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign up - DartDraw</title>
<style>
:root{--navy:#10233e;--blue:#1f6feb;--gold:#d9ad45;--ink:#142133;--muted:#5b6877;--line:#dbe2ea;--bg:#edf2f6;--red:#b3261e;--green:#1b6e3c}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:16px;background:var(--bg);font-family:Inter,Segoe UI,Arial,sans-serif;color:var(--ink)}
.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:32px;box-shadow:0 12px 28px #26394a1a;width:100%;max-width:380px}
.brand{display:flex;align-items:center;gap:11px;font-weight:800;letter-spacing:.3px;font-size:20px;margin-bottom:4px}
.brand-mark{width:31px;height:31px;border:3px solid var(--gold);border-radius:50%;display:grid;place-items:center;font-size:15px;background:var(--navy);color:var(--gold)}
h1{margin:0;font:inherit}
p.sub{margin:0 0 22px;color:var(--muted);font-size:13px}
.field{margin:0 0 14px}
.field label{display:block;font-size:12px;font-weight:700;margin-bottom:6px}
.hint{font-size:12px;color:var(--muted);margin-top:4px}
input{height:44px;border:1px solid #8a97a6;border-radius:7px;padding:9px 11px;font-size:16px;width:100%;font-family:inherit;color:var(--ink);background:#fff}
.btn{border:0;border-radius:8px;padding:11px 14px;min-height:44px;font-weight:750;font-size:14px;font-family:inherit;cursor:pointer;width:100%;background:var(--blue);color:#fff;margin-top:6px}
.btn:hover{background:#1a5fcc}
.btn:disabled{opacity:.6;cursor:default}
a:focus-visible,input:focus-visible,.btn:focus-visible,.msg:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
input:focus-visible{border-color:var(--blue)}
.msg{border-radius:8px;padding:9px 11px;font-size:13px;margin-bottom:14px}
.msg:empty{display:none}
.msg.err{background:#fdeceb;color:var(--red)}
.msg.ok{background:#e8f5ec;color:var(--green)}
.foot{text-align:center;margin-top:14px;font-size:13px;color:var(--muted)}
.foot a{display:inline-block;padding:10px 6px;color:var(--blue);text-decoration:underline;font-weight:700}
[hidden]{display:none!important}
</style>
</head>
<body>
<main class="card">
  <div class="brand"><span class="brand-mark" aria-hidden="true">D</span> <h1>DartDraw</h1></div>
  <p class="sub" id="intro">Create an organizer account.</p>
  <div class="msg" id="msg" aria-live="polite" tabindex="-1"></div>
  <form id="registerForm">
    <div class="field"><label for="name">Name</label><input type="text" id="name" autocomplete="name" maxlength="80" required></div>
    <div class="field"><label for="email">Email</label><input type="email" id="email" autocomplete="email" autocapitalize="none" spellcheck="false" required></div>
    <div class="field"><label for="password">Password</label><input type="password" id="password" autocomplete="new-password" minlength="8" aria-describedby="pwHint" required>
      <div class="hint" id="pwHint">At least 8 characters.</div>
    </div>
    <button class="btn" id="submitBtn" type="submit">Create account</button>
  </form>
  <div class="foot">Already have an account? <a href="/?login=1">Sign in</a></div>
</main>
<script>
const msgEl = document.getElementById('msg');
const form = document.getElementById('registerForm');
const btn = document.getElementById('submitBtn');
const introEl = document.getElementById('intro');

function show(text, kind){
  msgEl.textContent = text;
  msgEl.className = 'msg ' + kind;
}
// Replace the form with a message and move focus to it so screen readers announce it.
function closeForm(text, kind, intro){
  form.hidden = true;
  if(intro === undefined) introEl.hidden = true;   // no "Create an account." above a message that says otherwise
  else introEl.textContent = intro;
  show(text, kind);
  msgEl.focus();
}

// If sign-up is known to be closed, say so straight away. If the check fails we show the form
// anyway; the server refuses with 403 when it is closed.
fetch('/api/auth/config', { cache:'no-store' })
  .then((r) => r.ok ? r.json() : null)
  .then((cfg) => {
    if(!(cfg && cfg.signupOpen === false)) return;
    // The same words as the sign-in page's "No account yet?", plus the Admin's contact line (plain text, shown as text).
    const contact = typeof cfg.adminContact === 'string' ? cfg.adminContact.trim().slice(0, 200) : '';
    closeForm('Sign-up is not open yet. Accounts are created by the site admin.' + (contact ? ' ' + contact : ''), 'err');
  })
  .catch(() => {});

form.addEventListener('submit', async (e)=>{
  e.preventDefault();
  msgEl.textContent = ''; msgEl.className = 'msg';
  btn.disabled = true; btn.textContent = 'Creating account…';
  try{
    const res = await fetch('/api/auth/register', {
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({
        name: document.getElementById('name').value,
        email: document.getElementById('email').value,
        password: document.getElementById('password').value
      })
    });
    let body = {};
    try{ body = await res.json(); }catch(err){ body = {}; }
    if(res.ok){
      closeForm('Check your email to verify your account.', 'ok', 'Almost done.');
      return;
    }
    if(res.status === 403){
      closeForm(body.error || 'Sign-up is not open yet.', 'err');
      return;
    }
    show(body.error || 'Could not create account.', 'err');
  }catch(err){
    show('Could not reach the server. Check your connection and try again.', 'err');
  }
  btn.disabled = false; btn.textContent = 'Create account';
});
</script>
</body>
</html>
