<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#10233e">
<title>Scoring — DartDraw</title>
<style>
/* Colours as tokens (owner, 2026-11-02): a light set and a dark set that follows the phone's setting. The page says it
   has both (meta color-scheme), so a browser's own "dark mode" (Samsung Internet, Chrome) uses ours instead of
   repainting it. The header keeps the DartDraw navy in both. */
:root{color-scheme:light dark;
  --navy:#10233e;--gold:#d9ad45;
  --bg:#edf2f6;--card:#fff;--card2:#fff;--ink:#142133;--muted:#4c5967;--muted2:#5b6877;--line:#dbe2ea;--line2:#cad5e0;
  --blue:#1858c9;--onBlue:#fff;--link:#1858c9;--tagBg:#e6f0ff;--tagFg:#1a4fa3;--press:#f2f6fa;--chev:#9aa6b2;
  --amber:#6e4700;--amberBg:#fff8e6;--amberTag:#fbe3a8;--nextBg:#eef5fd;
  --green:#1b6e3c;--greenBg:#eaf6ef;--greenFg:#145c33;--red:#b3261e;
  --p1:#185fa5;--p1Bg:#eef5fd;--p1Fg:#fff;--p2:#9a5a07;--p2Bg:#fdf6ea;--p2Fg:#fff;
  --tabOnBg:#10233e;--tabOnFg:#fff;--tabOnLine:#10233e;--cntBg:#e6f0ff;--cntFg:#1a4fa3;--cntOnBg:#cbd8e6;--cntOnFg:#10233e;
  --nsLine:#e3a39b;--nsBg:#fdf0ee;--nsFg:#7a2219;--scrim:rgba(0,0,0,.45)}
@media (prefers-color-scheme: dark){:root{
  --bg:#0e141b;--card:#151c24;--card2:#1c2530;--ink:#e6edf3;--muted:#a6b4c2;--muted2:#8a9aab;--line:#26313d;--line2:#33404e;
  --blue:#3d8bff;--onBlue:#06121f;--link:#7fb2ff;--tagBg:#1f3550;--tagFg:#9cc4ff;--press:#1c2530;--chev:#5d6b7a;
  --amber:#ffd27a;--amberBg:#2b2210;--amberTag:#5a4210;--nextBg:#16263a;
  --green:#6fd39b;--greenBg:#173325;--greenFg:#9ff0c2;--red:#ff8a80;
  --p1:#5aa2ff;--p1Bg:#16263a;--p1Fg:#06121f;--p2:#f0a63a;--p2Bg:#2e2414;--p2Fg:#1d1405;
  --tabOnBg:#e6edf3;--tabOnFg:#0e141b;--tabOnLine:#e6edf3;--cntBg:#1f3550;--cntFg:#9cc4ff;--cntOnBg:#10233e;--cntOnFg:#e6edf3;
  --nsLine:#7a2e28;--nsBg:#2a1513;--nsFg:#ffb4ab;--scrim:rgba(0,0,0,.65)}}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,Segoe UI,Arial,sans-serif;font-size:15px}
header{background:var(--navy);color:#fff;padding:10px 14px 8px;position:sticky;top:0;z-index:5}
.top{display:flex;align-items:center;gap:10px}
.ev{flex:1;min-width:0;font-size:15px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lang{display:inline-flex;flex-shrink:0;border:1px solid #3b536f;border-radius:8px;overflow:hidden}
.lang button{background:transparent;color:#cbd8e6;border:0;padding:0;width:44px;font:inherit;font-size:13px;min-height:38px;cursor:pointer}
.lang button[aria-pressed="true"]{background:#fff;color:var(--navy);font-weight:700}
.net{font-size:13px;margin-top:4px;color:#cbd8e6;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.net.warn{color:#ffd27a}
main{padding:0 0 40px;max-width:640px;margin:0 auto}
main>.card{margin:12px}
/* the list (owner, 2026-11-02): a button per board, pinned board headings, stacked names under the paper's match tag */
.tabs{display:flex;gap:6px;padding:8px 12px;background:var(--card);border-bottom:1px solid var(--line);position:sticky;top:var(--hh,0px);z-index:4}
.tab{flex:1;min-height:40px;border-radius:9px;border:1px solid var(--line2);background:var(--card);font:inherit;font-weight:700;font-size:14px;color:var(--ink);cursor:pointer}
.tab[aria-pressed="true"]{background:var(--tabOnBg);border:2px solid var(--tabOnLine);color:var(--tabOnFg)}
.tab .cnt{display:inline-block;min-width:22px;padding:1px 6px;margin-left:4px;border-radius:11px;background:var(--cntBg);color:var(--cntFg);font-size:12px}
.tab[aria-pressed="true"] .cnt{background:var(--cntOnBg);color:var(--cntOnFg)}
.bh{position:sticky;top:calc(var(--hh,0px) + var(--th,0px));z-index:3;background:var(--bg);padding:7px 14px;font-size:13px;font-weight:700;color:var(--muted);border-bottom:1px solid var(--line)}
.mrow{display:flex;align-items:center;gap:10px;width:100%;padding:11px 14px;background:var(--card);border:0;border-bottom:1px solid var(--line);font:inherit;color:var(--ink);text-align:left}
button.mrow{cursor:pointer}
button.mrow:active{background:var(--press)}
.mrow .tx{flex:1;min-width:0}
.ptag{display:inline-block;font-size:13px;font-weight:700;background:var(--tagBg);color:var(--tagFg);border-radius:6px;padding:2px 8px;margin-bottom:5px}
.nm{font-size:15px;font-weight:600;line-height:1.3;overflow-wrap:anywhere}
.vs{font-size:12px;color:var(--muted);margin:1px 0}
.chev{flex-shrink:0;font-size:24px;color:var(--chev)}
.mrow.called{background:var(--amberBg)}
.mrow.called .ptag{background:var(--amberTag);color:var(--amber)}
.callmark{font-size:13px;font-weight:700;color:var(--amber);margin-top:3px}
.mrow.next{background:var(--nextBg)}
.nextmark{font-size:13px;font-weight:700;color:var(--link);margin-top:3px}
.go{flex-shrink:0;background:var(--blue);color:var(--onBlue);border-radius:9px;padding:10px 14px;font-weight:700}
.mrow.wait{color:var(--muted)}
.mrow.wait .nm{font-weight:500}
.mrow.done .nm{font-weight:500;color:var(--muted)}
.won{font-size:14px;font-weight:700;color:var(--green);margin-top:3px;overflow-wrap:anywhere}
.mrow .side{flex-shrink:0;text-align:right}
/* the form: a close button, each player's row with its colour bar and position badge, More options folded away */
.shead{display:flex;align-items:flex-start;gap:10px}
.shead .tx{flex:1;min-width:0}
.x{flex-shrink:0;width:40px;height:40px;border-radius:50%;border:1px solid var(--line2);background:var(--card2);font-size:18px;line-height:1;cursor:pointer;color:var(--ink)}
.pick{border-radius:12px;padding:8px 10px 10px 12px;margin:10px 0 0;border-left:5px solid}
.pick.p1{background:var(--p1Bg);border-left-color:var(--p1)}.pick.p2{background:var(--p2Bg);border-left-color:var(--p2)}
.pick h3{display:flex;align-items:center;gap:8px;margin:2px 0 8px;text-transform:none;letter-spacing:0;font-size:14px;color:var(--ink)}
.bd{flex-shrink:0;min-width:24px;height:24px;border-radius:12px;padding:0 6px;display:inline-flex;align-items:center;justify-content:center;font-size:13px;font-weight:700}
.p1 .bd{background:var(--p1);color:var(--p1Fg)}.p2 .bd{background:var(--p2);color:var(--p2Fg)}
.more{display:block;width:100%;margin-top:12px;background:none;border:0;font:inherit;font-size:14px;font-weight:600;color:var(--link);padding:10px;cursor:pointer}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin:0 0 12px}
h2{font-size:16px;margin:0 0 8px}
h3{font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:14px 0 6px}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.row:first-of-type{border-top:0}
.who{font-weight:600}
.meta{font-size:13px;color:var(--muted)}
.res{font-weight:700;white-space:nowrap}
.btn{border:0;border-radius:9px;padding:10px 14px;font:inherit;font-weight:600;min-height:44px;cursor:pointer;background:var(--blue);color:var(--onBlue)}
.btn.ghost{background:var(--card2);color:var(--link);border:1px solid var(--line2)}
.scores{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.btn.sc{min-height:58px;font-size:21px;color:var(--ink)}
.btn.sc.on{border:2px solid var(--green);background:var(--greenBg);color:var(--greenFg)}
.btn.sc.wo{grid-column:1/-1;min-height:46px;font-size:15px}
.check{text-align:center;padding:10px 0 4px}
.check .big{font-size:27px;font-weight:700;margin:6px 0 4px;overflow-wrap:anywhere}
.ctr{display:grid;grid-template-columns:1fr 56px 52px 56px;align-items:center;gap:8px;margin:10px 0}
.ctr-n{font-weight:600;overflow-wrap:anywhere}
.ctr b{font-size:24px;text-align:center}
.ctr .btn{min-height:52px;font-size:22px;padding:0}
.btn:disabled{opacity:.5}
.called{color:var(--amber);font-weight:700}
input.pin{font-size:28px;letter-spacing:.4em;text-align:center;width:100%;padding:10px;border:1px solid var(--line2);border-radius:10px;background:var(--card2);color:var(--ink)}
.err{color:var(--red);font-size:13px;min-height:18px;margin:6px 0}
.hint{font-size:13px;color:var(--muted)}
.stack{display:grid;gap:8px;margin-top:10px}
.sheet{position:fixed;inset:0;background:var(--scrim);display:flex;align-items:flex-end;justify-content:center;z-index:10}
.sheet .card{width:100%;max-width:640px;border-radius:14px 14px 0 0;margin:0;max-height:92vh;overflow:auto}
.tk{border-left:4px solid var(--link)}
.tk .row{flex-wrap:wrap}
.tk .side{display:flex;gap:8px}
.notsent{border-color:var(--nsLine);background:var(--nsBg);color:var(--nsFg)}
.notsent .meta{color:var(--nsFg)}
.pending{color:var(--amber);font-size:12px}
[hidden]{display:none !important}
</style>
</head>
<body>
<header id="topBar">
  <div class="top"><div class="ev" id="evLine">DartDraw</div>
    <div class="lang" role="group" id="langGroup" aria-label="Language / Bahasa"><button type="button" lang="en" data-lang="en" aria-pressed="true">EN</button><button type="button" lang="ms" data-lang="ms" aria-pressed="false">BM</button></div></div>
  <div class="net" id="netLine"></div>
</header>
<main id="main"></main>
<div class="sheet" id="sheet" hidden><div class="card" id="sheetBox"></div></div>
<script src="/i18n/score.en.js"></script>
<script src="/i18n/score.ms.js"></script>
<script src="/offline.js"></script>
<script src="/score.js"></script>
</body>
</html>
