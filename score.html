<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Scoring — DartDraw</title>
<style>
:root{--navy:#10233e;--blue:#1f6feb;--gold:#d9ad45;--ink:#142133;--muted:#5b6877;--line:#dbe2ea;--bg:#edf2f6;--card:#fff;--red:#b3261e;--green:#1b6e3c;--amber:#8a5a00;--amberBg:#fff8e6}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,Segoe UI,Arial,sans-serif;font-size:15px}
header{background:var(--navy);color:#fff;padding:12px 16px;position:sticky;top:0;z-index:5}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px}
.brand{font-weight:800;letter-spacing:.3px}
.ev{font-size:13px;color:#cbd8e6;margin-top:2px}
.lang{display:inline-flex;border:1px solid #3b536f;border-radius:8px;overflow:hidden}
.lang button{background:transparent;color:#cbd8e6;border:0;padding:6px 10px;font:inherit;font-size:12px;min-height:32px;cursor:pointer}
.lang button[aria-pressed="true"]{background:#fff;color:var(--navy);font-weight:700}
.net{font-size:13px;margin-top:6px;color:#cbd8e6}
.net.warn{color:#ffd27a}
main{padding:12px 16px 40px;max-width:640px;margin:0 auto}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin:0 0 12px}
h2{font-size:16px;margin:0 0 8px}
h3{font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:14px 0 6px}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.row:first-of-type{border-top:0}
.who{font-weight:600}
.meta{font-size:12px;color:var(--muted)}
.res{font-weight:700;white-space:nowrap}
.btn{border:0;border-radius:9px;padding:10px 14px;font:inherit;font-weight:600;min-height:44px;cursor:pointer;background:var(--blue);color:#fff}
.btn.ghost{background:#fff;color:var(--blue);border:1px solid var(--line)}
.btn.danger{background:#fff;color:var(--red);border:1px solid #e3a39b}
.btn:disabled{opacity:.5}
.called{color:var(--amber);font-weight:700}
input.pin{font-size:28px;letter-spacing:.4em;text-align:center;width:100%;padding:10px;border:1px solid var(--line);border-radius:10px}
.legs{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:8px 0}
.legs label{font-size:13px;color:var(--muted);display:block;margin-bottom:4px;overflow-wrap:anywhere}
.legs input{width:100%;font-size:24px;padding:8px;border:1px solid var(--line);border-radius:10px;text-align:center}
.err{color:var(--red);font-size:13px;min-height:18px;margin:6px 0}
.hint{font-size:13px;color:var(--muted)}
.stack{display:grid;gap:8px;margin-top:10px}
.sheet{position:fixed;inset:0;background:#0007;display:flex;align-items:flex-end;justify-content:center;z-index:10}
.sheet .card{width:100%;max-width:640px;border-radius:14px 14px 0 0;margin:0;max-height:92vh;overflow:auto}
.notsent{border-color:#e3a39b;background:#fdf0ee;color:#7a2219}
.pending{color:var(--amber);font-size:12px}
[hidden]{display:none !important}
</style>
</head>
<body>
<header>
  <div class="top"><div><div class="brand">DartDraw</div><div class="ev" id="evLine"></div></div>
    <div class="lang" role="group" id="langGroup" aria-label="Language / Bahasa"><button type="button" lang="en" data-lang="en" aria-pressed="true">EN</button><button type="button" lang="ms" data-lang="ms" aria-pressed="false">BM</button></div></div>
  <div class="net" id="netLine"></div>
</header>
<main id="main"></main>
<div class="sheet" id="sheet" hidden><div class="card" id="sheetBox"></div></div>
<script src="/i18n/score.en.js"></script>
<script src="/i18n/score.ms.js"></script>
<script src="/offline.js"></script>
<script src="/score.js"></script>
</body>
</html>
