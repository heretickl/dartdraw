<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#030507">
<!-- Built by scripts/build-casual-single.js from scoring_app/. Do not edit: edit scoring_app/ and rebuild. -->
<title>DartDraw · Casual play</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@600;700&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* The scoring screens (scoring-screens.js), as approved in docs/design/screens-yours/. Drawn at 660px wide; mount()
   scales .dds to the phone with zoom. Barlow Semi Condensed for names, scores, keys, headings and buttons; Manrope for
   secondary lines. Side a blue, side b gold. */
.dds{--a:#22b0ff;--a2:#0e8ff0;--b:#ffc61a;--b2:#d99a00;--red:#ff2433;--green:#3df08a;--ink:#f5f8fb;--mut:#cfd8e1;
  --bar:'Barlow Semi Condensed',sans-serif;--man:Manrope,'Segoe UI',sans-serif;
  position:relative;width:660px;min-height:982px;margin:0 auto;padding:0 22px 20px;box-sizing:border-box;color:var(--ink);font-family:var(--man);
  background:radial-gradient(120% 60% at 50% 35%,rgba(30,45,60,.22),transparent 70%),linear-gradient(rgba(120,170,220,.035) 1px,transparent 1px),linear-gradient(90deg,rgba(120,170,220,.035) 1px,transparent 1px),linear-gradient(180deg,#05080b,#030507);
  background-size:auto,28px 28px,28px 28px,auto;overflow:hidden;-webkit-tap-highlight-color:transparent;user-select:none}
.dds *{box-sizing:border-box}
.dds button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;touch-action:manipulation}
.dds button[disabled]{cursor:default}
.dds b{font-weight:inherit}

/* header */
.dds-hd{display:grid;grid-template-columns:90px 1fr 140px;align-items:center;height:120px}
.dds-hd .ic{color:#fff;width:56px;height:56px;display:flex;align-items:center;justify-content:center}
.dds-hd .ttl{text-align:center;line-height:1.1}
.dds-hd .t1{font:700 34px var(--bar);letter-spacing:.01em}
.dds-hd .t2{font:500 20px var(--man);color:#8fd8ff;letter-spacing:.06em;margin-top:2px}
.dds-hd .t3{font:500 17px var(--man);color:#e9eef3;margin-top:4px;white-space:nowrap}
.dds-hd .rt{display:flex;align-items:center;justify-content:flex-end;gap:6px}
.dds-hd .pill{font:700 20px var(--bar);padding:7px 16px;border-radius:99px;background:linear-gradient(180deg,#ff2e3c,#e3101e);box-shadow:0 0 16px rgba(255,36,51,.55);white-space:nowrap}

/* score cards and legs */
.dds-cards{display:grid;grid-template-columns:minmax(0,1fr) 104px minmax(0,1fr);gap:12px;align-items:center;height:166px}
.dds .card{position:relative;height:148px;border-radius:18px;display:flex;flex-direction:column;align-items:center;justify-content:center;opacity:.72;transition:opacity .15s}
.dds .card.on{opacity:1}
.dds .card.side-a{border:2px solid #28b4ff;background:linear-gradient(180deg,#07111c,#04080d);box-shadow:-9px 9px 0 0 var(--a2),inset 0 0 22px rgba(30,150,255,.28),0 0 26px rgba(20,160,255,.45)}
.dds .card.side-b{border:2px solid #ffc81f;background:linear-gradient(180deg,#110e05,#070604);box-shadow:9px 9px 0 0 var(--b2),inset 0 0 22px rgba(255,190,20,.22),0 0 26px rgba(255,190,20,.4)}
.dds .card.on.side-a{box-shadow:-9px 9px 0 0 var(--a2),inset 0 0 22px rgba(30,150,255,.35),0 0 34px rgba(20,160,255,.85)}
.dds .card.on.side-b{box-shadow:9px 9px 0 0 var(--b2),inset 0 0 22px rgba(255,190,20,.3),0 0 34px rgba(255,190,20,.8)}
.dds .card .nm{font:700 41px/1 var(--bar);max-width:94%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dds .card .sc{font:700 88px/1 var(--bar);background:linear-gradient(180deg,#fff 40%,#cfd6de);-webkit-background-clip:text;background-clip:text;color:transparent;padding-bottom:4px}
.dds .legs{display:flex;flex-direction:column;align-items:center;gap:6px}
.dds .legs .lb{font:500 21px var(--man)}
.dds .legs .ls{font:700 50px/1 var(--bar)}
.dds .legs .la{color:#9fe0ff}.dds .legs .lb2{color:#e8f5ff}
.dds .legs .dots{display:flex;gap:9px;flex-wrap:wrap;justify-content:center;max-width:104px}
.dds .dot{width:19px;height:19px;border-radius:50%;background:#6c747e}
.dds .dot.side-a{background:var(--a);box-shadow:0 0 8px var(--a)}.dds .dot.side-b{background:var(--b);box-shadow:0 0 8px var(--b)}

/* panels */
.dds .panel,.dds .last3{border-radius:18px;border:1.5px solid rgba(110,180,255,.2);border-top-color:rgba(90,180,255,.5);background:linear-gradient(180deg,rgba(22,40,62,.75),rgba(10,18,28,.7) 40%,rgba(8,14,22,.6));box-shadow:inset 0 1px 0 rgba(140,200,255,.18)}
.dds .last3{margin-top:16px;padding:14px 8px 8px}
.dds .last3 .ttl{font:600 28px var(--bar);text-align:center;padding-bottom:10px;background:linear-gradient(90deg,transparent,#2a9cff 35%,#7fd4ff 50%,#2a9cff 65%,transparent) bottom/260px 3px no-repeat}
.dds .last3 .hd,.dds .last3 .row{display:grid;grid-template-columns:1fr 84px 1fr;text-align:center;align-items:center}
.dds .last3 .hd{font:600 26px var(--bar);height:52px}
.dds .last3 .row{font:700 37px var(--bar);height:52px;border-top:1px solid rgba(255,255,255,.07)}
.dds .last3 .row span:nth-child(2){font:600 35px var(--bar);color:#dfe6ee;border-left:1px solid rgba(255,255,255,.1);border-right:1px solid rgba(255,255,255,.1);height:100%;display:flex;align-items:center;justify-content:center}
.dds .last3 .row.new{border-radius:14px;border-top-color:transparent}
.dds.throw-a .last3 .row.new{background:linear-gradient(90deg,#1c8dff 0%,rgba(28,141,255,.35) 22%,rgba(28,141,255,.08) 55%,rgba(28,141,255,.05))}
.dds.throw-b .last3 .row.new{background:linear-gradient(270deg,#e0a800 0%,rgba(255,198,26,.35) 22%,rgba(255,198,26,.08) 55%,rgba(255,198,26,.05))}

/* dart by dart with the last 3 scores on screen (owner 2026-11-04): the table and THIS TURN are drawn tighter */
.dds.compact .last3{margin-top:10px;padding:8px 8px 4px}
.dds.compact .last3 .ttl{font-size:22px;padding-bottom:6px;background-size:200px 2px}
.dds.compact .last3 .hd{height:34px;font-size:21px}
.dds.compact .last3 .row{height:38px;font-size:30px}
.dds.compact .last3 .row span:nth-child(2){font-size:26px}
.dds.compact .turnp{margin-top:10px;padding:8px 18px 12px}
.dds.compact .turnp .ttl{display:none}
.dds.compact .turnp .line{margin:4px 0 8px;font-size:23px;display:grid;grid-template-columns:1fr auto 1fr;gap:10px}
.dds.compact .turnp .scored{text-align:center;color:#fff}
.dds.compact .turnp .after{text-align:right}
.dds.compact .slot{height:66px}.dds.compact .slot b{font-size:34px}.dds.compact .slot span{font-size:16px}
.dds.compact .mults{margin-top:10px}
.dds.compact .grid{margin-top:9px;grid-auto-rows:minmax(44px,72px)}
.dds.compact .grid .k{min-height:44px}
.dds.compact .dbar{margin-top:12px;height:68px}
.dds.compact .turnp .hint{margin-top:8px;padding:2px 18px;font-size:22px}
.dds.compact .slot{height:60px}

/* the score being typed (option C), in the thrower's colour */
.dds .entry{margin-top:12px;height:62px;border-radius:18px;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:0 20px}
.dds .entry.side-a{border:2.5px solid #22b4ff;background:rgba(8,18,30,.85);box-shadow:0 0 18px rgba(34,176,255,.55),inset 0 0 16px rgba(34,176,255,.18)}
.dds .entry.side-b{border:2.5px solid #ffc61a;background:rgba(26,20,4,.85);box-shadow:0 0 18px rgba(255,190,20,.5),inset 0 0 16px rgba(255,190,20,.16)}
.dds .entry .who{font:600 22px var(--bar);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dds .entry.side-a .who{color:#7fd0ff}.dds .entry.side-b .who{color:#ffd86a}
.dds .entry .val{font:700 50px/1 var(--bar);min-width:90px;text-align:center}
.dds .entry .lv{font:500 19px var(--man);color:#cfd8e1;text-align:right;white-space:nowrap}
.dds .entry .lv b{font:700 28px var(--bar);color:#fff;margin-left:4px}
.dds .pad .go{display:flex;align-items:center;justify-content:center;gap:10px;font-size:36px}

/* checkout hint (gear: Checkout hints) */
.dds .hint{margin:12px auto 0;width:max-content;padding:6px 22px;border-radius:99px;border:2px solid rgba(61,240,138,.6);background:rgba(15,90,44,.45);color:#4dff8f;font:700 26px var(--bar);letter-spacing:.02em}
.dds .undorow{display:flex;justify-content:center;margin-top:22px}
.dds .undob{height:62px;padding:0 30px;border-radius:16px;display:flex;align-items:center;gap:10px;font:700 26px var(--bar)}

/* quick scores and keypad */
.dds .quick{margin-top:12px;display:flex;flex-direction:column;gap:10px;align-items:center}
.dds .quick div{display:flex;gap:12px;justify-content:center}
.dds .q{font:700 30px/1 var(--bar);width:108px;height:44px;border-radius:99px;border:2.5px solid rgba(235,240,245,.7);background:#0a0e13}
.dds .q.gold{color:var(--b);border:3px solid var(--b);background:rgba(255,198,26,.1);box-shadow:0 0 16px rgba(255,198,26,.6),inset 0 0 8px rgba(255,198,26,.25)}
.dds .pad{margin-top:16px;display:grid;grid-template-columns:repeat(3,1fr) 124px;gap:8px 13px}
.dds .k,.dds .key{height:56px;border-radius:12px;background:linear-gradient(180deg,#19212b,#10161d);border:1px solid rgba(255,255,255,.06);font:700 44px/1 var(--bar);display:flex;align-items:center;justify-content:center}
.dds .k.undo{flex-direction:column;gap:2px;font:600 20px/1 var(--bar)}
.dds .k.bust{font-size:25px;line-height:1.05;text-align:center;color:#ff4250;text-shadow:0 0 12px rgba(255,36,51,.8);background:linear-gradient(180deg,#2e1219,#1f0c11)}
.dds .k.zero{grid-column:1 / span 2;height:62px}
.dds .go,.dds .red{border-radius:16px;background:linear-gradient(180deg,#ff2e3c,#e3101e);box-shadow:0 0 22px rgba(255,36,51,.7);font:700 40px/1 var(--bar)}
.dds .pad .go{grid-column:3 / span 2;height:62px}
.dds .go[disabled]{opacity:.45;box-shadow:none}

/* pop-ups: over the faded screen, in the colour of the side they are about */
.dds .veil{position:absolute;inset:0;background:rgba(2,4,8,.6);backdrop-filter:blur(3px) brightness(.6);-webkit-backdrop-filter:blur(3px) brightness(.6);z-index:5}
.dds .pop{position:absolute;left:44px;right:44px;top:170px;z-index:6;border-radius:24px;padding:28px 30px 30px;display:flex;flex-direction:column;align-items:center;text-align:center;gap:10px}
.dds .pop.side-a{border:3px solid #22b4ff;background:linear-gradient(180deg,rgba(8,22,36,.96),rgba(4,10,18,.98));box-shadow:0 0 0 1px rgba(34,180,255,.4),0 0 26px rgba(34,176,255,.8),0 0 60px rgba(34,176,255,.3),inset 0 0 26px rgba(34,176,255,.22)}
.dds .pop.side-b{border:3px solid #ffc61a;background:linear-gradient(180deg,rgba(30,24,6,.96),rgba(12,9,3,.98));box-shadow:0 0 0 1px rgba(255,198,26,.4),0 0 26px rgba(255,190,20,.75),0 0 60px rgba(255,190,20,.3),inset 0 0 26px rgba(255,190,20,.2)}
.dds .pop h2{font:700 40px/1.1 var(--bar);margin:6px 0 0}
.dds .pop p{font:500 20px/1.4 var(--man);color:#e3e9ef;margin:0}
.dds .pop .pill{font:700 24px var(--bar);padding:6px 60px;border-radius:99px}
.dds .pop .pill.won{color:#4dff8f;background:#0f5a2c;box-shadow:0 0 12px rgba(61,240,138,.35)}
.dds .pop .pill.gold{color:#1a1400;background:linear-gradient(180deg,#ffd43a,#f0b400)}
.dds .pop .who{font:700 76px/1 var(--bar);margin-top:8px}
.dds .pop .sub{font:500 20px var(--man);letter-spacing:.14em;color:#cfd8e1}
.dds .pop .big{font:700 92px/1 var(--bar);margin:6px 0 4px}
.dds .pop .fds{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;width:100%;margin-top:6px}
.dds .fd{height:128px;border-radius:18px;border:1.5px solid rgba(255,255,255,.18);background:rgba(14,20,28,.75);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px}
.dds .fd b{font:700 46px/1 var(--bar)}.dds .fd span{font:500 20px var(--man)}
.dds .fd.off{opacity:.55}.dds .fd.off b{color:#8a96a3}
.dds .pop.side-a .fd:not(.off){border:3px solid #5fd0ff;background:linear-gradient(180deg,#2196ff,#0a5ad0);box-shadow:0 0 22px rgba(30,150,255,.75)}
.dds .pop.side-b .fd:not(.off){border:3px solid #ffe27a;background:linear-gradient(180deg,#ffd23a,#e3a600);box-shadow:0 0 22px rgba(255,190,20,.7);color:#1a1400}
.dds .ghost{margin-top:22px;padding:14px 40px;border-radius:99px;border:2.5px solid rgba(235,240,245,.7);font:700 28px var(--bar)}
.dds .two{display:grid;grid-template-columns:1fr 1.25fr;gap:16px;width:100%;margin-top:14px}
.dds .two button{height:68px;border-radius:18px;font:700 28px var(--bar)}
.dds .dk{border:2px solid rgba(255,255,255,.45)!important;background:rgba(14,20,28,.75)!important}
.dds .blue{border:2.5px solid #5fd0ff!important;background:linear-gradient(180deg,#2196ff,#0a5ad0)!important;box-shadow:0 0 22px rgba(30,150,255,.7)}
.dds .goldb{border:2.5px solid #ffe27a!important;background:linear-gradient(180deg,#ffd23a,#e3a600)!important;box-shadow:0 0 22px rgba(255,190,20,.7);color:#1a1400!important}

/* dart by dart (x01) */
.dds .turnp{margin-top:16px;padding:14px 22px 20px}
.dds .turnp .ttl{font:500 28px var(--man);text-align:center;padding-bottom:12px;background:linear-gradient(90deg,transparent,#2a9cff 35%,#7fd4ff 50%,#2a9cff 65%,transparent) bottom/260px 3px no-repeat}
.dds .turnp .line{display:flex;justify-content:space-between;margin:20px 0 12px;font:700 25px var(--bar)}
.dds.throw-a .turnp .who{color:var(--a)}.dds.throw-b .turnp .who{color:var(--b)}
.dds .turnp .line{gap:14px}.dds .turnp .scored,.dds .turnp .after{flex:none;white-space:nowrap}
.dds .turnp .who{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dds .slots{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;width:100%}
.dds .slot{height:88px;border-radius:16px;border:1.5px solid rgba(255,255,255,.22);background:rgba(8,12,18,.6);display:flex;flex-direction:column;align-items:center;justify-content:center}
.dds .slot span{font:500 19px var(--man);color:#cfd8e1}.dds .slot b{font:700 40px/1.1 var(--bar)}
.dds .slot.now{border:3px solid #22b4ff;background:rgba(34,150,255,.1);box-shadow:0 0 16px rgba(34,176,255,.5)}.dds .slot.now span{color:#7fd0ff}
.dds.throw-b .slot.now{border-color:#ffc61a;background:rgba(255,198,26,.1);box-shadow:0 0 16px rgba(255,190,20,.5)}.dds.throw-b .slot.now span{color:#ffd86a}
.dds.throw-b .dbar .shown{border-color:#ffc61a;box-shadow:0 0 16px rgba(255,190,20,.4)}
.dds .mults{margin-top:12px;display:grid;grid-template-columns:repeat(3,1fr);padding:5px;border-radius:99px;border:1.5px solid rgba(255,255,255,.2);background:rgba(8,12,18,.6)}
.dds .mults button{height:36px;border-radius:99px;font:700 21px var(--bar)}
.dds .mults button.on{background:linear-gradient(180deg,#2196ff,#0a5ad0);box-shadow:0 0 14px rgba(30,150,255,.7)}
.dds .grid{margin-top:11px;display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.dds .grid .k{height:50px;font-size:32px}.dds .grid .k.sm{font-size:25px}.dds .grid .k.bust{font-size:19px}
.dds .dbar{margin-top:16px;display:grid;grid-template-columns:140px 1fr 166px;gap:14px;height:76px}
.dds .dbar .undo{border-radius:18px;display:flex;align-items:center;justify-content:center;gap:8px;font:700 28px var(--bar)}
.dds .dbar .shown{border-radius:18px;border:2.5px solid #22b4ff;background:rgba(8,18,30,.8);box-shadow:0 0 16px rgba(34,176,255,.4);display:flex;align-items:center;justify-content:center;font:700 38px var(--bar)}
.dds .dbar .enter{display:flex;align-items:center;justify-content:center;gap:10px;font-size:34px}
.dds .enter[disabled]{opacity:.45;box-shadow:none}

/* cricket */
.dds .cricket{margin-top:14px;padding:12px 6px 16px}
.dds .chd{display:grid;grid-template-columns:186px 1fr 186px;text-align:center;font:600 22px var(--bar);padding-bottom:8px}
.dds .crow{display:grid;grid-template-columns:186px 54px 90px 54px 186px;gap:0 8px;justify-content:center;align-items:center;margin:0 0 9px}
.dds .crow>div{height:53px;border-radius:12px;background:rgba(4,8,12,.65);border:1px solid rgba(255,255,255,.06);display:flex;align-items:center;justify-content:center;gap:12px;position:relative}
.dds .mk{width:32px;height:32px;border-radius:50%;border:2.5px solid #e8eef5;display:flex;align-items:center;justify-content:center}
.dds .ma .mk.on{border-color:var(--a);box-shadow:0 0 10px var(--a)}
.dds .mb .mk.on{border-color:var(--b);box-shadow:0 0 10px var(--b)}
.dds .mk.on::after{content:"\00d7";font:700 38px/1 var(--man);margin-top:-4px}
.dds .ma .mk.on::after{color:var(--a)}.dds .mb .mk.on::after{color:var(--b)}
.dds .closed::before{content:"";position:absolute;left:12px;right:12px;top:50%;height:4px;margin-top:-2px;border-radius:2px}
.dds .ma.closed::before{background:var(--a);box-shadow:0 0 8px var(--a)}.dds .mb.closed::before{background:var(--b);box-shadow:0 0 8px var(--b)}
.dds .crow .dt,.dds .crow .num{height:53px;border-radius:12px;display:flex;align-items:center;justify-content:center;background:linear-gradient(180deg,#19212b,#10161d);border:1.5px solid rgba(255,255,255,.12);font:700 27px var(--bar)}
.dds .crow .num{border:2px solid rgba(255,255,255,.4);font-size:36px}
.dds .crow .dt.none{opacity:.25;color:transparent}
.dds .crow.dead .dt,.dds .crow.dead .num{opacity:.3;filter:blur(1.5px)}
.dds .cricket .miss{display:flex;margin:4px auto 0;width:212px;height:52px;font-size:28px}

/* bulls, Choice */
.dds .bullp{margin-top:10px;display:flex;gap:22px;padding:10px;align-items:center}
.dds .bullp .tg{width:135px;height:146px;border-radius:12px;background:#080b0f;display:flex;align-items:center;justify-content:center;flex:none}
.dds .bullp h3{font:700 38px var(--bar);margin:0}.dds .bullp h4{font:700 34px var(--bar);margin:4px 0}
.dds .bullp p{font:500 20px var(--man);margin:0}
.dds .closest{font:700 42px var(--bar);margin:32px 0 16px}
.dds .bbtns{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.dds .bb{height:142px;border-radius:18px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;border:2px solid rgba(255,255,255,.3)!important;background:rgba(14,20,28,.75)!important}
.dds .bb b{font:700 39px var(--bar);max-width:95%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.dds .bb span{font:500 23px var(--man)}
.dds .bb.side-a:active{border:3px solid #5fd0ff!important;background:linear-gradient(180deg,#2196ff,#0a5ad0)!important;box-shadow:0 0 28px rgba(30,150,255,.85)}
.dds .bb.side-b:active{border:3px solid #ffe27a!important;background:linear-gradient(180deg,#ffd23a,#e3a600)!important;color:#1a1400}
.dds .again{font:500 20px var(--man);color:#cfd8e1;text-align:center;margin-top:28px}
.dds .decp{display:flex;justify-content:space-between;align-items:center;margin:4px 0 16px}
.dds .decp .pill{display:inline-block;font:700 24px var(--bar);padding:4px 18px;border-radius:99px;color:#1a1400;background:linear-gradient(180deg,#ffd43a,#f0b400)}
.dds .decp h2{font:700 50px var(--bar);margin:10px 0 0}
.dds .lbox{width:145px;height:103px;justify-content:center;border-radius:14px;border:2px solid rgba(255,255,255,.45);background:rgba(14,20,28,.75)}
.dds .lbox .ls{font-size:52px}
.dds .decp h2.huge{font:700 84px/1 var(--bar);margin:6px 0 0}
.dds .steps{display:flex;flex-direction:column;gap:8px;margin-bottom:16px}
.dds .step{display:flex;align-items:center;gap:14px;min-height:50px;padding:6px 10px;border-radius:12px;border:1.5px solid rgba(255,255,255,.14);background:linear-gradient(180deg,rgba(30,40,52,.55),rgba(14,20,28,.55));font:500 22px var(--man)}

   correction is a new event, so every version of every turn can be shown and restored (spec 8.1), and changing an older

        toWin: M.legsToWin(M.normalizeFormat(format)), legsWon: { a: s.legsWon.a, b: s.legsWon.b }, throwing: throwing, sides: sides,
        last3: last3, last6: last6, cricket: cricket,

        pending: pending ? { score: pending.score, choices: pending.choices.slice() } : null, askBust: askBust,

  /* ---------- the whole screen ---------- */

  /* A screen clearly wider than tall (a tablet or phone on its side, a laptop) gets the side-by-side layout. */

  /* Scale a 660 x 982 screen (1280 x 720 when wide) to fit the window both ways, and stretch it to the window's height

     wide window needs no scrolling (owner 2026-11-04: every device). The width is the page's own (clientWidth): a page

    var storage = opts.storage, w = opts.words, player = opts.player || null;
    var data;
    if (player) data = loadAcct(storage, player);
    else {
      data = load(storage) || { picks: cleanPicks(null), events: null, screen: 'setup' };
      // A logged-in player's game left on the phone is not a guest's to go on with: a fresh setup (the game picks kept).
      var raw = readRaw(storage);
      if (raw && raw.owner) data = { picks: cleanPicks({ game: data.picks.game, bestOf: data.picks.bestOf, legs: data.picks.legs }), events: null, screen: 'setup' };
    }
    var prefs = loadPrefs(storage);
    var match = null, screen = null, mopts = null, chooser = null, sendingId = null;   // sendingId: the game whose save is on its way
    var doc = root.ownerDocument || (typeof document !== 'undefined' ? document : null);
    var me = player ? { name: myName(player), full: (String(player.firstName || '') + ' ' + String(player.lastName || '')).trim() } : null;

    function keep() { save(storage, data); }
    function setupState() {
      var err = player && !data.opp ? 'name_missing' : checkNames(data.picks.a, data.picks.b), btn = root.querySelector('[data-cs="start"]'), msg = root.querySelector('.cserr');
      if (btn) { if (err) btn.setAttribute('disabled', ''); else btn.removeAttribute('disabled'); }
      if (msg) msg.textContent = err === 'name_same' ? w.err_name_same : '';
    }
    function showSetup() {
      screen = null; match = null; mopts = null; chooser = null;
      root.innerHTML = renderSetup(data.picks, w, me ? { name: me.name, full: me.full, opp: data.opp } : undefined);
      zoom();
      setupState();
    }
    function zoom() { Screens().fit(root.firstChild); }
    function showGame() {
      match = matchFrom(data, prefs.hints);
      root.innerHTML = '<div class="cg"></div>';
      mopts = {
        words: w, header: headerFor(data.picks, w), pill: null, mode: prefs.mode, hints: prefs.hints,
        summaryButtons: [{ label: w.newGame, act: 'newGame' }, { label: w.rematch, act: 'rematch', main: true }],
        gearButtons: [{ label: w.endGame, act: 'endGame', confirm: { title: w.endTitle, text: w.endText, yes: w.endYes } }],
        onChange: function (m) { data.events = m.events(); keep(); if (!data.save) over(); },
        onPrefs: function (p) { prefs = { mode: p.mode, hints: p.hints }; try { storage.setItem(PREFS, JSON.stringify(prefs)); } catch (e) { /* play on */ } },
        onAction: action
      };
      if (player) { mopts.savedLine = savedLine(data.save, data.opp, w); mopts.lockTurns = locked(); }
      screen = Screens().mount(root.firstChild, match, mopts);
      // Reopened at the result: a game not sent yet, or still waiting, is sent now (the server stores an id once).
      if (!data.save || data.save === 'queued' || data.save === 'relogin') over();
    }
    function action(a) {
      var v = match.view();
      if (a === 'back') {
        // Before the first turn the back arrow returns to setup; once the game is on (and on the result), it opens
        // the leg's turns, so a mistake can be checked and fixed instead of losing the game.
        if (v.ask === 'bull' && v.bull.leg === 0) { data.screen = 'setup'; data.events = null; fresh(null); keep(); showSetup(); }
        else screen.act('turns');
      } else if (a === 'newGame' || a === 'endGame') {
        // Ending early (or a new game from the result) sends nothing more: only a finished match is ever saved.
        data.screen = 'setup'; data.events = null; fresh(null); keep(); showSetup();
      } else if (a === 'rematch') {
        data.screen = 'game'; data.events = []; fresh(newId()); keep(); showGame();
      } else if (a === 'relogin' && opts.onRelogin) {
        opts.onRelogin();
      }
    }
    /* A logged-in game's id and save state, for a new game (id) or none yet (null). */
    function fresh(id) {
      if (!player) return;
      data.gameId = id; data.save = null; data.playedAt = null;
    }

    /* ---- logged in: saving the finished game ---- */

    /* The result's turns are locked once the game has gone to the server or the queue: a change after that would never
       reach the scorecard. Not for guests, nor for a game the server refused (nothing was saved). */
    function locked() { return !!(player && (sendingId === data.gameId || (data.save && data.save !== 'dropped'))); }
    function show(st) {
      if (!mopts || !screen) return;
      mopts.savedLine = savedLine(st, data.opp, w); mopts.lockTurns = locked(); screen.refresh();
    }
    function bodyFor(id) {
      return {
        id: id, format: Scoring().formatFor({ game: data.picks.game, bestOf: data.picks.bestOf, legs: data.picks.legs }), events: match.events(),
        playedAt: data.playedAt, sideA: { me: true }, sideB: data.opp.guest ? { guest: data.opp.name } : { friendshipId: data.opp.id }
      };
    }
    function over() {
      if (!player || !match || !match.view().winner || !data.opp || !data.gameId || !opts.net) return;
      var id = data.gameId, net = opts.net;
      if (sendingId === id) return;   // already on its way
      if (!data.playedAt) { data.playedAt = new Date().toISOString(); keep(); }
      var body = bodyFor(id);
      if (sendingId) {
        // The last game's save is still on its way (a quick rematch): this one waits in the queue, and is sent as soon
        // as that answer is back (below), or by the queue's own flush.
        net.queue.add({ id: id, player: player.id, game: body });
        data.save = 'queued'; keep(); show('queued');
        return;
      }
      sendingId = id;
      show(data.save);
      net.api('/api/games/save', { method: 'POST', body: body }).then(function (r) {
        sendingId = null;
        var st;
        if (r.ok && r.body && r.body.saved) {
          var f = r.body.saved.friend;
          st = f === 'saved' ? 'saved' : f === 'held' ? 'held' : 'mine';
          net.queue.remove(id);   // it may have waited there (offline earlier): saved now, so not sent again
        } else if (r.status === 0 || r.status >= 500 || r.status === 429) {
          // No signal, or the server failing: it waits on the phone and goes at start-up / back online (app.js).
          net.queue.add({ id: id, player: player.id, game: body }); st = 'queued';
        } else if (r.status === 401 || r.status === 403) {
          // The session ran out during the game: kept, and sent once the player has logged in again.
          net.queue.add({ id: id, player: player.id, game: body }); st = 'relogin';
        } else {
          // Refused for good (the server will never take this one): nothing to retry, nothing to show.
          if (typeof console !== 'undefined') console.warn('casual game not saved', r.status, r.body && r.body.code);
          net.queue.remove(id);
          st = 'dropped';
        }
        if (data.gameId !== id) {
          // A new game was started meanwhile: the answer belonged to the old one. A new game that finished and was queued
          // in the meantime goes now.
          if (data.save === 'queued' && st !== 'queued' && st !== 'relogin') over();
          return;
        }
        data.save = st; keep(); show(st);
      });
    }

    /* ---- logged in: Player 2 ---- */

    function pickOpp(o) {
      data.opp = cleanOpp(o);
      data.picks.b = data.opp ? oppName(data.opp, me.name) : '';
      keep(); showSetup();
    }
    /* A fresh friends list is in hand: a remembered friend whose entry is no longer on it (removed, merged, or the friend
       removed or blocked the player) is not kept as Player 2, so the setup goes back to Choose opponent instead of
       showing an old badge for a game that would not count for them. Only on the setup screen: a game already started
       is saved for the player alone by the server. Answers true when Player 2 was cleared. */
    function checkOpp(friends) {
      if (!Array.isArray(friends) || data.screen !== 'setup' || !data.opp || data.opp.guest) return false;
      var id = data.opp.id;
      if (friends.some(function (f) { return f && f.id === id; })) return false;
      data.opp = null; data.picks.b = ''; keep();
      return true;
    }
    function openChooser() {
      var O = g().DDOpponent;
      if (!O || !opts.ctx || !doc || chooser) return;
      chooser = doc.createElement('div');   // outside the zoomed setup screen: the panel is drawn at the phone's own size
      root.appendChild(chooser);
      var shown = data.opp;
      O.renderChoose(chooser, opts.ctx, { current: data.opp, onList: checkOpp }, function (o) {
        if (chooser && chooser.parentNode) chooser.parentNode.removeChild(chooser);
        chooser = null;
        if (o) pickOpp(o);
        // Closed without a choice after Player 2 was cleared while the panel was open: the setup now shows Choose opponent.
        else if (data.opp !== shown) showSetup();
      });
    }

    root.addEventListener('input', function (ev) {
      var t = ev.target;
      if (!t || (t.id !== 'csA' && t.id !== 'csB')) return;
      data.picks[t.id === 'csA' ? 'a' : 'b'] = String(t.value).slice(0, 20);
      keep(); setupState();
    });
    root.addEventListener('click', function (ev) {
      var el = ev.target && ev.target.closest ? ev.target.closest('[data-cs]') : null;
      if (!el || el.hasAttribute('disabled')) return;
      var k = el.getAttribute('data-cs'), val = el.getAttribute('data-v');
      if (k === 'game') { data.picks.game = val; keep(); showSetup(); }
      else if (k === 'best') { data.picks.bestOf = Number(val); keep(); showSetup(); }
      else if (k === 'leg') { var p = String(val).split(':'); data.picks.legs[Number(p[0])] = p[1]; keep(); showSetup(); }
      else if (k === 'opp' && player) openChooser();
      else if (k === 'start' && !checkNames(data.picks.a, data.picks.b) && (!player || data.opp)) { data.screen = 'game'; data.events = []; fresh(newId()); keep(); showGame(); }
    });

    if (player) {
      // From a friend's card ("Play <nickname>"): that friend is Player 2, unless a game with them or another is already on.
      var pw = opts.playWith;
      if (pw && typeof pw.friendshipId === 'string' && (data.screen !== 'game' || !(data.events && data.events.length))) {
        data.screen = 'setup'; data.events = null; fresh(null);
        data.opp = cleanOpp({ id: pw.friendshipId, name: pw.nickname || pw.name || '', full: pw.name || '', badge: pw.badge });
        data.picks.b = data.opp ? oppName(data.opp, me.name) : '';
        keep();
      }
      // Back online with the result on screen and the game waiting: send it now, so the line changes.
      if (typeof window !== 'undefined' && window.addEventListener) {
        var onOnline = function () {
          if (root.isConnected === false) { window.removeEventListener('online', onOnline); return; }
          if (data.save === 'queued' && match && match.view().winner) over();
        };
        window.addEventListener('online', onOnline);
      }
    }
    if (data.screen === 'game') showGame(); else showSetup();
    // The setup opened with a friend remembered as Player 2: their entry is checked against a fresh list (no signal: kept
    // as it is). The setup is redrawn only while it is still on screen with no panel open over it.
    if (player && data.screen === 'setup' && data.opp && !data.opp.guest && opts.ctx && opts.ctx.api) {
      opts.ctx.api('/api/friends/list').then(function (r) {
        if (!(r && r.ok && r.body && Array.isArray(r.body.friends))) return;
        if (checkOpp(r.body.friends) && !screen && !chooser && root.isConnected !== false) showSetup();
      });
    }
    return { match: function () { return match; }, data: function () { return data; } };
  }

  return { start: start, checkNames: checkNames, save: save, load: load, matchFrom: matchFrom, headerFor: headerFor, renderSetup: renderSetup, newId: newId, KEY: KEY };
});
</script>
<script>
  (function () {
    var storage = null;
    try { storage = window.localStorage; storage.getItem('dd-casual-v1'); }
    catch (e) { storage = { getItem: function () { return null; }, setItem: function () {}, removeItem: function () {} }; }
    var app = document.getElementById('app');
    DDCasual.start(app, { storage: storage, words: DD_CASUAL_EN });
    window.addEventListener('resize', function () { DDScreens.fit(app.querySelector('.dds')); });
  })();
</script>
</body>
